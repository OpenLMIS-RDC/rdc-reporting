table_name: Taux de satisfaction des commandes
main_dttm_col: null
currency_code_column: null
description: "Lignes de r\xE9quisition (mart_stock_status du core) avec les quantit\xE9\
  s demand\xE9es, approuv\xE9es et re\xE7ues et le taux de satisfaction."
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: curated
sql: "-- \"Taux de satisfaction des commandes\": one row per requisition line item\
  \ of\n-- core mart_stock_status (legacy: stock_status_and_consumption) with the\n\
  -- requested / approved / received quantities and the satisfaction rate.\n-- quantite_livree\
  \ is the approved quantity, as legacy order_quantity was\n-- sum(approvedquantity)\
  \ per line item.\nselect\n  s.facility_id                                      \
  \ as facility_id,\n  'REQ-' || upper(s.program_code)\n    || '-' || formatDateTime(s.period_start_date,\
  \ '%Y%m')\n    || '-' || upper(substring(toString(s.requisition_id), 1, 8)) as numero_commande,\n\
  \  s.product_code                                      as code_produit,\n  s.product_name\
  \                                      as nom_du_produit,\n  o.description     \
  \                                  as unite_du_produit,\n  s.requested_quantity\
  \                                as quantite_demandee,\n  s.approved_quantity  \
  \                               as quantite_approuvee,\n  s.approved_quantity  \
  \                               as quantite_livree,\n  coalesce(s.total_received_quantity,\
  \ 0)              as quantite_recue,\n  if(s.requested_quantity > 0,\n    round(s.approved_quantity\
  \ / s.requested_quantity * 100, 2),\n    0)                                    \
  \            as taux_de_satisfaction_pct,\n  df.geographic_level               \
  \                  as niveau_organisationnel,\n  df.geographic_zone_name       \
  \                      as zone_geographique,\n  df.facility_type_name          \
  \                     as type_de_structure,\n  s.facility_name                 \
  \                    as structure,\n  s.program_name                           \
  \           as programme,\n  toYear(s.period_start_date)                       \
  \  as annee,\n  toMonth(s.period_start_date)                        as mois,\n \
  \ s.period_name                                       as periode,\n  -- date de\
  \ saisie: requisition creation, as UAT after the export\n  toYear(r.created_date)\
  \                              as annee_saisie,\n  toMonth(r.created_date)     \
  \                        as mois_saisie,\n  case toMonth(r.created_date) when 1\
  \ then '01 \xB7 Janvier' when 2 then '02 \xB7 F\xE9vrier' when 3 then '03 \xB7 Mars'\
  \ when 4 then '04 \xB7 Avril' when 5 then '05 \xB7 Mai' when 6 then '06 \xB7 Juin'\
  \ when 7 then '07 \xB7 Juillet' when 8 then '08 \xB7 Ao\xFBt' when 9 then '09 \xB7\
  \ Septembre' when 10 then '10 \xB7 Octobre' when 11 then '11 \xB7 Novembre' when\
  \ 12 then '12 \xB7 D\xE9cembre' end\n                                          \
  \            as mois_saisie_nom\nfrom curated.mart_stock_status s\nleft join curated.mart_drc_facility_directory\
  \ df\n  on df.facility_id = s.facility_id\nleft join curated.stg_orderables o\n\
  \  on o.id = s.orderable_id\nleft join curated.stg_requisitions r\n  on r.id = s.requisition_id\n\
  -- Legacy kept lines where requested or order quantity IS NOT NULL. Core\n-- reads\
  \ both as 0 when absent, so lines with neither are dropped on 0.\nwhere s.requested_quantity\
  \ != 0 or s.approved_quantity != 0\n"
