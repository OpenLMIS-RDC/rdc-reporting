  - column_name: horizon_expiration
    verbose_name: Horizon d’expiration
    is_dttm: false
    is_active: true
    type: null
    groupby: true
    filterable: true
    expression: CASE WHEN toDate(date_expiration) < today() THEN '0. Déjà expiré' WHEN dateDiff('day',
      today(), toDate(date_expiration)) <= 30 THEN '1. ≤ 30 j' WHEN dateDiff('day', today(), toDate(date_expiration))
      <= 60 THEN '2. 31-60 j' WHEN dateDiff('day', today(), toDate(date_expiration)) <= 90 THEN '3. 61-90
      j' ELSE '4. > 90 j' END
    description: Fenêtre d'échéance calculée à partir de la date d'expiration et de la date du jour.
