  expression: "CASE WHEN toDate(date_expiration) < today() THEN '0. D\xE9j\xE0 expir\xE9\
    ' WHEN dateDiff('day', today(), toDate(date_expiration)) <= 30 THEN '1. \u2264\
    \ 30 j' WHEN dateDiff('day', today(), toDate(date_expiration)) <= 60 THEN '2.\
    \ 31-60 j' WHEN dateDiff('day', today(), toDate(date_expiration)) <= 90 THEN '3.\
    \ 61-90 j' ELSE '4. > 90 j' END"
  description: "Fen\xEAtre d'\xE9ch\xE9ance calcul\xE9e \xE0 partir de la date d'expiration\
