  - column_name: mois_saisie_nom
    verbose_name: Mois de saisie
    is_dttm: false
    is_active: true
    type: null
    groupby: true
    filterable: true
    expression: 'CASE toMonth(date_initiated) WHEN 1 THEN ''01 · Janvier'' WHEN 2 THEN ''02 · Février'' WHEN 3 THEN ''03 · Mars'' WHEN 4 THEN ''04 · Avril'' WHEN 5 THEN ''05 · Mai'' WHEN 6 THEN ''06 · Juin'' WHEN 7 THEN ''07 · Juillet'' WHEN 8 THEN ''08 · Août'' WHEN 9 THEN ''09 · Septembre'' WHEN 10 THEN ''10 · Octobre'' WHEN 11 THEN ''11 · Novembre'' WHEN 12 THEN ''12 · Décembre'' END'
    description: null
metrics:
  - metric_name: nb_en_attente
    verbose_name: Réquisitions non libérées
    metric_type: null
    expression: SUM(CASE WHEN nb_liberee = 0 THEN 1 ELSE 0 END)
    description: null
    d3format: ',d'
    extra: null
    warning_text: null
  - metric_name: taux_conversion_pct
    verbose_name: Taux de conversion en commande (%)
    metric_type: null
    expression: 100.0 * SUM(nb_liberee) / NULLIF(SUM(nb_soumise), 0)
    description: null
    d3format: ',.1f'
    extra: null
    warning_text: null
  - metric_name: delai_moyen_soumission_j
    verbose_name: Délai moyen initiation → soumission (j)
    metric_type: null
    expression: AVG(delai_initiation_a_soumission_j)
    description: null
    d3format: ',.1f'
    extra: null
    warning_text: null
  - metric_name: anciennete_moyenne_j
    verbose_name: Ancienneté moyenne sans mouvement (j)
    metric_type: null
    expression: AVG((if(date_released IS NULL, round(dateDiff('second', date_last_change, now()) / 86400.0,
      1), NULL)))
    description: null
    d3format: ',.1f'
    extra: null
    warning_text: null
  - metric_name: delai_moyen_total_j
    verbose_name: Délai moyen total (jours)
