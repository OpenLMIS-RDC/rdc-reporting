    verbose_name: Mois (nom)
    is_dttm: false
    is_active: true
    type: null
    groupby: true
    filterable: true
    expression: CASE mois WHEN 1 THEN 'Janvier' WHEN 2 THEN '​Février' WHEN 3 THEN '​​Mars' WHEN 4 THEN
      '​​​Avril' WHEN 5 THEN '​​​​Mai' WHEN 6 THEN '​​​​​Juin' WHEN 7 THEN '​​​​​​Juillet' WHEN 8 THEN
      '​​​​​​​Août' WHEN 9 THEN '​​​​​​​​Septembre' WHEN 10 THEN '​​​​​​​​​Octobre' WHEN 11 THEN '​​​​​​​​​​Novembre'
      WHEN 12 THEN '​​​​​​​​​​​Décembre' END
    description: null
  - column_name: anciennete_sans_mouvement_j
