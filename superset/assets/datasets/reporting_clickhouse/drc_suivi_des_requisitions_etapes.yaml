table_name: "Suivi des r\xE9quisitions \u2013 \xE9tapes"
main_dttm_col: date_initiated
currency_code_column: null
description: "Une ligne par r\xE9quisition et par \xE9tape du circuit (6 \xE9tapes),\
  \ d\xE9pivot\xE9e de mart_drc_requisition_leadtime."
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: curated
sql: "-- \"Suivi des r\xE9quisitions \u2013 \xE9tapes\": one row per requisition x\
  \ step of the\n-- circuit (6 steps), unpivoted from mart_drc_requisition_leadtime.\n\
  -- Legacy: CROSS JOIN LATERAL (VALUES ...) over analytics.fact_requisition_leadtime.\n\
  -- delai_etape_j is the time from the previous step, in days, NULL for the\n-- first\
  \ step and for steps not reached.\nselect\n  l.facility_id            as facility_id,\n\
  \  l.numero_requisition     as numero_requisition,\n  l.statut_requisition     as\
  \ statut_requisition,\n  l.type_requisition       as type_requisition,\n  l.date_initiated\
  \         as date_initiated,\n  e.1                      as etape,\n  e.2      \
  \                as atteinte,\n  e.3                      as delai_etape_j,\n  l.niveau_organisationnel\
  \ as niveau_organisationnel,\n  l.zone_geographique      as zone_geographique,\n\
  \  l.type_de_structure      as type_de_structure,\n  l.structure              as\
  \ structure,\n  l.programme              as programme,\n  l.annee              \
  \    as annee,\n  l.mois                   as mois,\n  l.periode               \
  \ as periode,\n  -- date de saisie: requisition initiation, as UAT after the export\n\
  \  toYear(l.date_initiated) as annee_saisie,\n  toMonth(l.date_initiated) as mois_saisie,\n\
  \  case toMonth(l.date_initiated) when 1 then '01 \xB7 Janvier' when 2 then '02\
  \ \xB7 F\xE9vrier' when 3 then '03 \xB7 Mars' when 4 then '04 \xB7 Avril' when 5\
  \ then '05 \xB7 Mai' when 6 then '06 \xB7 Juin' when 7 then '07 \xB7 Juillet' when\
  \ 8 then '08 \xB7 Ao\xFBt' when 9 then '09 \xB7 Septembre' when 10 then '10 \xB7\
  \ Octobre' when 11 then '11 \xB7 Novembre' when 12 then '12 \xB7 D\xE9cembre' end\n\
  \                           as mois_saisie_nom\nfrom curated.mart_drc_requisition_leadtime\
  \ l\narray join [\n  tuple('1. Initi\xE9e', toUInt8(1), cast(null, 'Nullable(Float64)')),\n\
  \  tuple('2. Soumise', toUInt8(l.date_submitted is not null),\n    round(dateDiff('second',\
  \ l.date_initiated, l.date_submitted) / 86400.0, 2)),\n  tuple('3. Autoris\xE9e',\
  \ toUInt8(l.date_authorized is not null),\n    round(dateDiff('second', l.date_submitted,\
  \ l.date_authorized) / 86400.0, 2)),\n  tuple('4. En cours d''approbation', toUInt8(l.date_in_approval\
  \ is not null),\n    round(dateDiff('second', l.date_authorized, l.date_in_approval)\
  \ / 86400.0, 2)),\n  tuple('5. Approuv\xE9e', toUInt8(l.date_approved is not null),\n\
  \    round(dateDiff('second', l.date_in_approval, l.date_approved) / 86400.0, 2)),\n\
  \  tuple('6. Lib\xE9r\xE9e', toUInt8(l.date_released is not null),\n    round(dateDiff('second',\
  \ l.date_approved, l.date_released) / 86400.0, 2))\n] as e\n"
