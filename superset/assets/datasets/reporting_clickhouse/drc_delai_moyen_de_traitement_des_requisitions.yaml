table_name: Délai moyen de traitement des réquisitions
uuid: e9654cf8-c497-42e4-a130-9ecb68cb08d2
version: 1.0.0
database_uuid: b1a2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
schema: curated
main_dttm_col: null
description: Lignes de « Taux de satisfaction des commandes » avec le délai entre l'initiation et la libération
  de la réquisition.
default_endpoint: null
offset: 0
cache_timeout: null
sql: |
  -- "Délai moyen de traitement des réquisitions": the "Taux de satisfaction des
  -- commandes" lines (core mart_stock_status) with the requisition's
  -- initiation and release dates from mart_drc_requisition_leadtime and the
  -- processing time between them, in days.
  select
    s.facility_id                                       as facility_id,
    'REQ-' || upper(s.program_code)
      || '-' || formatDateTime(s.period_start_date, '%Y%m')
      || '-' || upper(substring(toString(s.requisition_id), 1, 8)) as numero_commande,
    s.product_code                                      as code_produit,
    s.product_name                                      as nom_du_produit,
    o.description                                       as unite_du_produit,
    s.requested_quantity                                as quantite_demandee,
    s.approved_quantity                                 as quantite_approuvee,
    s.approved_quantity                                 as quantite_livree,
    coalesce(s.total_received_quantity, 0)              as quantite_recue,
    if(s.requested_quantity > 0,
      round(s.approved_quantity / s.requested_quantity * 100, 2),
      0)                                                as taux_de_satisfaction_pct,
    l.date_initiated                                    as date_demande,
    l.date_released                                     as date_reception,
    round(dateDiff('second', l.date_initiated, l.date_released) / 86400.0, 1)
                                                        as delai_traitement_jours,
    df.geographic_level                                 as niveau_organisationnel,
    df.geographic_zone_name                             as zone_geographique,
    df.facility_type_name                               as type_de_structure,
    s.facility_name                                     as structure,
    s.program_name                                      as programme,
    toYear(s.period_start_date)                         as annee,
    toMonth(s.period_start_date)                        as mois,
    s.period_name                                       as periode
  from curated.mart_stock_status s
  left join curated.mart_drc_facility_directory df
    on df.facility_id = s.facility_id
  left join curated.stg_orderables o
    on o.id = s.orderable_id
  left join curated.mart_drc_requisition_leadtime l
    on l.req_id = s.requisition_id
  -- Legacy kept lines where requested or order quantity IS NOT NULL. Core
  -- reads both as 0 when absent, so lines with neither are dropped on 0.
  where s.requested_quantity != 0 or s.approved_quantity != 0
