      '​​​​​​​Août' WHEN 9 THEN '​​​​​​​​Septembre' WHEN 10 THEN '​​​​​​​​​Octobre' WHEN 11 THEN '​​​​​​​​​​Novembre'
      WHEN 12 THEN '​​​​​​​​​​​Décembre' END
    description: null
  - column_name: tranche_delai
    verbose_name: Tranche de délai
    is_dttm: false
    is_active: true
    type: null
    groupby: true
    filterable: true
    expression: CASE WHEN delai_traitement_jours IS NULL THEN '5. Non réceptionné' WHEN delai_traitement_jours
      <= 7 THEN '1. Moins de 7 jours' WHEN delai_traitement_jours <= 14 THEN '2. 8-14 jours' WHEN delai_traitement_jours
      <= 30 THEN '3. 15-30 jours' ELSE '4. Plus de 30 jours' END
    description: Regroupement du délai de traitement en tranches
