# Embedded-dashboard UUIDs, one per dashboard slug.
#
# These are the `embeddeduuid` values of the `report.dashboard_reports` rows in
# OpenLMIS. Superset's metadata database is wiped on every restore deploy, so a
# UUID minted through the Superset UI would orphan those rows. rdc-deployment
# `dev/reporting-stack/deploy-remote.sh` inserts these into Superset's
# `embedded_dashboards` after `make setup` instead (idempotent, keyed on slug).
#
# Keep the format flat, one `slug: uuid` per line: deploy-remote.sh parses it
# with sed, not a YAML library. `superset import-directory` ignores this file
# (no databases/ / datasets/ / charts/ / dashboards/ prefix), and the package
# validator only reads `^uuid:` lines, so these UUIDs do not collide with
# asset UUIDs.

# DRC dashboards (this package)
rapport_stock_rdc: 3be39da2-6dbc-4f11-b293-24ea5de79c70        # Suivi journalier des stocks
rapport_stock_superset: 6904a35a-b1a2-431a-a2af-310d831c697b   # Suivi mensuel des stocks
gestion_des_commandes: 4368c095-7456-4631-9bd4-556912e30cbd    # Suivi des commandes

