  \ .editable-title,\n.dashboard .ant-tabs-nav .ant-tabs-tab span { font-size: 10.5px !important; }\n\n\
  /* ===== B. SYSTEME DE DESIGN v3 (cadres, KPI, onglets, tables) ===== */\n/* =====================================================================\n\
  \   LOGIMEV - Systeme de design du tableau de bord  (v3)\n   Cadres, en-tetes, cartes KPI, tables, onglets\
  \ - valable sur TOUS les onglets\n   =====================================================================\
  \ */\n\n/* ---------- 1. CADRE DES CARTES ---------- */\n.dashboard-component-chart-holder{\n  position:relative;background:#ffffff;border:1px\
