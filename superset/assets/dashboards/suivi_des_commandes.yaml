css: "/* ===== A. CHARTE LOGIMEV (bandeau + barre de filtres bleu marine) ===== */\n/* ============================================================\n\
  \   Gestion des commandes - habillage repris de \"Rapport d'etat de stock\"\n   ============================================================\
  \ */\n/* ====== THEME LOGIMEV - Rapport d'etat de stock ====== */\n\n/* --- Fond general bleu --- */\n\
