  \ .with-std-tabs,\n.dashboard-component-tabs-content, .grid-row, .dragdroppable-row {\n  background-color:\
  \ #4E93CF !important;\n}\n\n\n.grid-content { padding: 12px !important; }\n\n\n\n/* --- Bandeau de titre\
  \ bleu fonce --- */\n.dashboard-header-container, .dashboard-header {\n  background-color: #1F3864 !important;\n\
  \  border-bottom: none !important;\n  box-shadow: none !important;\n}\n\n\n.dashboard-header .editable-title\
  \ input,\n.dashboard-header .editable-title span,\n.dashboard-header [data-test=\"editable-title-input\"\
