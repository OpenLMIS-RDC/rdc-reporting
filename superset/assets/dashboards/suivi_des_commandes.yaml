  \  flex:1 1 auto;min-width:0;padding-right:46px!important;\n  max-height:none!important;-webkit-line-clamp:4!important;overflow:visible!important;\n\
  }\n.dashboard-component-chart-holder .chart-header .header-title .editable-title>span{\n  display:block;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;\n\
  \  font-size:11.5px!important;font-weight:700!important;line-height:1.25!important;\n  letter-spacing:.15px;color:#0f172a!important;\n\
  }\n\n/* ---------- 3. CARTES KPI ---------- */\n.chart-slice[data-test-viz-type=\"big_number_total\"\
  ]{--kpi:#1d4ed8;--kpi-soft:#eff6ff;--kpi-ring:#dbeafe;}.chart-slice[data-test-chart-id=\"44\"],\n.chart-slice[data-test-chart-id=\"\
