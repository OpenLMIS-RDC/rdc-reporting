css: "/* ============================================================\n   LOGIMEV\
  \ - feuille Superset 6 (rework minimum viable, phase 7d)\n   Les regles propres\
  \ a un graphique sont cle'es sur\n   .chart-slice[data-test-chart-name=\"<slice_name\
  \ du YAML>\"] et non plus\n   sur l'id numerique (#chart-id-N / data-test-chart-id):\
  \ les ids changent\n   a chaque import (dev, UAT, prod), une regle cle'e sur un\
  \ id finit par\n   styler le mauvais graphique. Le nom (slice_name) est stable.\n\
  \   Supprime: regles sur ids legacy (couleurs KPI par famille, largeurs de\n   colonnes),\
  \ teinte de ligne par Gravite (dependait du style inline de\n   Superset 1.5), selecteurs\
  \ DOM Superset 1.5 disparus.\n   ============================================================\
  \ */\n\n/* ===== A. CHARTE LOGIMEV (bandeau + barre de filtres bleu marine) =====\
  \ */\n/* ============================================================\n   Gestion\
  \ des commandes - habillage repris de \"Rapport d'etat de stock\"\n   ============================================================\
  \ */\n/* ====== THEME LOGIMEV - Rapport d'etat de stock ====== */\n\n/* --- Fond\
  \ general bleu --- */\nbody,\n#app,\n.dashboard,\n.dashboard-content,\n[data-test=\"\
  dashboard-content-wrapper\"],\n.grid-content,\n.dashboard .dashboard-grid,\n.dashboard-component-tabs-content,\n\
  .grid-row,\n.dragdroppable-row { background-color: #4E93CF !important; }\n\n.grid-content\
  \ { padding: 12px !important; }\n\n/* --- Bandeau de titre bleu fonce --- */\n.dashboard-header-container\
  \ { background-color: #1F3864 !important; border-bottom: none !important; box-shadow:\
  \ none !important; }\n\n.dashboard-header-container [data-test=\"editable-title-input\"\
  ],\n.dashboard-header-container .title-panel .input-sizer { color: #FFFFFF !important;\
  \ font-weight: 700 !important; font-size: 22px !important; background: transparent\
  \ !important; }\n\n/* --- Onglets en paves --- */\n.dashboard .ant-tabs-nav { background:\
  \ transparent !important; margin-bottom: 10px !important; }\n\n.dashboard .ant-tabs-nav::before\
  \ { border-bottom: none !important; }\n\n.dashboard .ant-tabs-ink-bar { display:\
  \ none !important; }\n\n.dashboard .ant-tabs-tab { background-color: #8FB8DE !important;\
  \ border-radius: 4px 4px 0 0 !important; margin: 0 4px 0 0 !important; padding:\
  \ 10px 14px !important; border: none !important; white-space: nowrap !important;\
  \ }\n\n.dashboard .ant-tabs-tab .ant-tabs-tab-btn,\n.dashboard .ant-tabs-tab .ant-tabs-tab-btn\
  \ * { color: #1F3864 !important; font-weight: 600 !important; font-size: 12px !important;\
  \ text-transform: uppercase; white-space: nowrap !important; }\n\n.dashboard .ant-tabs-tab.ant-tabs-tab-active\
  \ { background-color: #1F3864 !important; }\n\n.dashboard .ant-tabs-tab.ant-tabs-tab-active\
  \ .ant-tabs-tab-btn,\n.dashboard .ant-tabs-tab.ant-tabs-tab-active .ant-tabs-tab-btn\
  \ * { color: #FFFFFF !important; }\n\n/* --- Cartes de graphiques / tableaux ---\
  \ */\n.dashboard-component-chart-holder { background-color: #FFFFFF !important;\
  \ border: 1px solid #2E5C8A !important; border-radius: 6px !important; box-shadow:\
  \ 0 2px 6px rgba(0,0,0,0.18) !important; padding: 6px 8px !important; }\n\n.dashboard-component-chart-holder\
  \ .header-title,\n.dashboard-component-chart-holder .header-title span,\n[data-test=\"\
  slice-header\"] .header-title { color: #1F3864 !important; font-weight: 700 !important;\
  \ text-align: center !important; width: 100% !important; }\n\n/* --- Blocs Markdown\
  \ (en-tete / legende) --- */\n.dashboard-markdown { background-color: #FFFFFF !important;\
  \ border: 1px solid #2E5C8A !important; border-radius: 6px !important; }\n\n/* ---\
  \ Barre de filtres --- */\n[data-test=\"filter-bar\"],\n[data-test=\"filter-bar\"\
  ] > div,\n[data-test=\"filter-bar\"] > div > div { background-color: #4E93CF !important;\
  \ }\n\n[data-test=\"filter-bar\"] h4,\n[data-test=\"filter-bar\"] label,\n[data-test=\"\
  filter-bar\"] .ant-form-item-label > label { color: #FFFFFF !important; font-weight:\
  \ 700 !important; }\n\n[data-test=\"filter-bar\"] .ant-form-item { background-color:\
  \ #1F3864 !important; border-radius: 6px !important; padding: 8px 10px 4px 10px\
  \ !important; margin-bottom: 12px !important; }\n\n[data-test=\"filter-bar\"] .ant-select-selector\
  \ { border-radius: 4px !important; border: 1px solid #FFFFFF !important; background-color:\
  \ #FFFFFF !important; }\n\n[data-test=\"filter-bar\"] .ant-select-selection-placeholder,\n\
  [data-test=\"filter-bar\"] .ant-select-selection-item { color: #1F3864 !important;\
  \ }\n\n[data-test=\"filter-bar__expand-button\"] svg,\n[data-test=\"filter-bar__filter-icon\"\
  ] svg { color: #FFFFFF !important; }\n\n/* --- Tableaux --- */\n.dashboard table\
  \ thead th { background-color: #DCE6F1 !important; color: #1F3864 !important; font-weight:\
  \ 700 !important; }\n\n.dashboard table tbody tr:nth-child(even) { background-color:\
  \ #EEF4FB !important; }\n\n/* --- Boutons de la barre de filtres --- */\n[data-test=\"\
  filter-bar__apply-button\"] { background-color: #1F3864 !important; border-color:\
  \ #1F3864 !important; color: #FFFFFF !important; font-weight: 700 !important; }\n\
  \n[data-test=\"filter-bar__apply-button\"] span { color: #FFFFFF !important; }\n\
  \n[data-test=\"filter-bar__clear-button\"],\n[data-test=\"filter-bar__clear-button\"\
  ] span,\n[data-test=\"filter-bar\"] .ant-btn-link span,\n[data-test=\"filter-bar\"\
  ] [role=\"button\"] { color: #FFFFFF !important; }\n\n/* --- Bouton Clear all :\
  \ fond bleu marine, texte blanc --- */\n[data-test=\"filter-bar__clear-button\"\
  ] { background-color: #1F3864 !important; border: 1px solid #1F3864 !important;\
  \ border-radius: 4px !important; color: #FFFFFF !important; font-weight: 700 !important;\
  \ }\n\n[data-test=\"filter-bar__clear-button\"] span { color: #FFFFFF !important;\
  \ }\n\n[data-test=\"filter-bar__clear-button\"]:hover { background-color: #2E5C8A\
  \ !important; border-color: #2E5C8A !important; color: #FFFFFF !important; }\n\n\
  /* === RESPONSIVE === */\n/* --- fluidite generale --- */\n.dashboard .grid-content,\n\
  .dashboard-content,\n.dashboard-component-chart-holder { max-width: 100% !important;\
  \ }\n\n.dashboard-component-chart-holder .chart-container,\n.dashboard-component-chart-holder\
  \ .slice_container { width: 100% !important; max-width: 100% !important; }\n\n.dashboard-component-chart-holder\
  \ .superset-chart-table,\n.dashboard-component-chart-holder .chart-slice[data-test-viz-type=\"\
  pivot_table_v2\"] { overflow-x: auto !important; max-width: 100% !important; }\n\
  \n/* --- barre de filtres : on recupere de la place sur petits ecrans --- */\n@media\
  \ (max-width: 1100px) {\n\n  [data-test=\"filter-bar\"].open,\ndiv:has(> [data-test=\"\
  filter-bar\"].open) { width: 210px !important; min-width: 210px !important; flex:\
  \ 0 0 210px !important; }\n  [data-test=\"filter-bar\"].open .ant-select { font-size:\
  \ 11px !important; }\n\n}\n\n@media (max-width: 820px) {\n\n  [data-test=\"filter-bar\"\
  ].open,\ndiv:has(> [data-test=\"filter-bar\"].open) { width: 175px !important; min-width:\
  \ 175px !important; flex: 0 0 175px !important; }\n\n}\n\n/* === LISIBILITE & LIBELLES\
  \ (9) === */\n.dashboard [data-test=\"slice-header\"] .header-title,\n.dashboard\
  \ [data-test=\"slice-header\"] .header-title .editable-title { overflow: visible\
  \ !important; text-overflow: clip !important; white-space: normal !important; }\n\
  \n.dashboard [data-test=\"slice-header\"] .header-title { height: auto !important;\
  \ max-height: 42px; line-height: 1.2 !important; }\n\n.dashboard [data-test=\"slice-header\"\
  ] { align-items: flex-start !important; }\n\n.dashboard .ant-tabs-nav .ant-tabs-tab\
  \ { padding: 7px 11px !important; }\n\n.dashboard .ant-tabs-nav .ant-tabs-tab .editable-title,\n\
  .dashboard .ant-tabs-nav .ant-tabs-tab span { font-size: 11.5px !important; letter-spacing:\
  \ 0.2px !important; }\n\n.dashboard .ant-tabs-nav .ant-tabs-tab { padding: 7px 9px\
  \ !important; }\n\n.dashboard .ant-tabs-nav .ant-tabs-tab .editable-title,\n.dashboard\
  \ .ant-tabs-nav .ant-tabs-tab span { font-size: 10.5px !important; }\n\n/* =====\
  \ B. SYSTEME DE DESIGN v3 (cadres, KPI, onglets, tables) ===== */\n/* =====================================================================\n\
  \   LOGIMEV - Systeme de design du tableau de bord  (v3)\n   Cadres, en-tetes, cartes\
  \ KPI, tables, onglets - valable sur TOUS les onglets\n   =====================================================================\
  \ */\n\n/* ---------- 1. CADRE DES CARTES ---------- */\n.dashboard-component-chart-holder\
  \ { position: relative; background: #ffffff; border: 1px solid #e7ecf5; border-radius:\
  \ 16px; box-shadow: 0 1px 2px rgba(15,23,42,.05),0 12px 28px -20px rgba(15,23,42,.55);\
  \ transition: box-shadow .28s ease,transform .28s ease,border-color .28s ease; }\n\
  .dashboard-component-chart-holder:hover { border-color: #c7d2fe; transform: translateY(-2px);\
  \ box-shadow: 0 2px 6px rgba(15,23,42,.07),0 26px 48px -24px rgba(37,99,235,.55);\
  \ }\n.dashboard-component-chart-holder::after { content: \"\"; position: absolute;\
  \ left: 16px; right: 16px; top: 0; height: 3px; z-index: 2; border-radius: 0 0 6px\
  \ 6px; pointer-events: none; background: linear-gradient(90deg,#1d4ed8,#7c3aed 55%,#06b6d4);\
  \ opacity: .9; }\n\n/* ---------- 2. EN-TETE DE CARTE (titre entier, jamais tronque)\
  \ ---------- */\n.dashboard-component-chart-holder [data-test=\"slice-header\"]\
  \ { position: relative; height: auto!important; align-items: flex-start!important;\
  \ padding-right: 2px; }\n.dashboard-component-chart-holder [data-test=\"slice-header\"\
  ] .header-controls { position: absolute!important; top: 0; right: 0; z-index: 5;\
  \ transform: scale(.75); transform-origin: top right; opacity: .5; transition: opacity\
  \ .2s; }\n.dashboard-component-chart-holder:hover [data-test=\"slice-header\"] .header-controls\
  \ { opacity: 1; }\n.dashboard-component-chart-holder [data-test=\"slice-header\"\
  ] .header-title { flex: 1 1 auto; min-width: 0; padding-right: 46px!important; max-height:\
  \ none!important; -webkit-line-clamp: 4!important; overflow: visible!important;\
  \ }\n.dashboard-component-chart-holder [data-test=\"slice-header\"] .header-title\
  \ .editable-title { display: block; white-space: normal!important; overflow: visible!important;\
  \ text-overflow: clip!important; font-size: 11.5px!important; font-weight: 700!important;\
  \ line-height: 1.25!important; letter-spacing: .15px; color: #0f172a!important;\
  \ }\n\n/* ---------- 3. CARTES KPI ---------- */\n.chart-slice[data-test-viz-type=\"\
  big_number_total\"] { --kpi: #1d4ed8; --kpi-soft: #eff6ff; --kpi-ring: #dbeafe;\
  \ }\n\n.chart-slice[data-test-viz-type=\"big_number_total\"] .superset-legacy-chart-big-number\
  \ { background: none!important; border-radius: 14px; padding: 2px 6px 8px!important;\
  \ align-items: center!important; justify-content: center!important; }\n.chart-slice[data-test-viz-type=\"\
  big_number_total\"] .header-line { height: auto!important; line-height: 1.02!important;\
  \ font-weight: 800!important; letter-spacing: -.02em; color: var(--kpi)!important;\
  \ text-align: center!important; width: 100%; white-space: nowrap!important; font-size:\
  \ 30px!important; }\n@media (min-width:1100px) {\n.chart-slice[data-test-viz-type=\"\
  big_number_total\"] .header-line { font-size: 36px!important; }\n}\n@media (min-width:1300px)\
  \ {\n.chart-slice[data-test-viz-type=\"big_number_total\"] .header-line { font-size:\
  \ 44px!important; }\n}\n@media (min-width:1550px) {\n.chart-slice[data-test-viz-type=\"\
  big_number_total\"] .header-line { font-size: 54px!important; }\n}\n@media (min-width:1850px)\
  \ {\n.chart-slice[data-test-viz-type=\"big_number_total\"] .header-line { font-size:\
  \ 62px!important; }\n}\n.chart-slice[data-test-viz-type=\"big_number_total\"] .subheader-line\
  \ { font-size: 11px!important; height: auto!important; line-height: 1.35!important;\
  \ font-weight: 600!important; color: var(--kpi)!important; text-align: center!important;\
  \ white-space: normal!important; width: fit-content; max-width: 96%; margin: 12px\
  \ auto 0!important; padding: 6px 12px; background: #ffffffcc; border: 1px solid\
  \ var(--kpi-ring); border-radius: 999px; }\n/* Teinte de fond + lisere colore, par\
  \ famille d'indicateur */\n\n/* ---------- 4. TABLES ---------- */\n.dashboard-component-chart-holder\
  \ .chart-container table th { background: #f8fafc!important; color: #0f172a!important;\
  \ font-weight: 700!important; border-bottom: 2px solid #e2e8f0!important; letter-spacing:\
  \ .2px; }\n.dashboard-component-chart-holder .chart-container table td { border-bottom:\
  \ 1px solid #f1f5f9!important; }\n.dashboard-component-chart-holder .chart-container\
  \ table tbody tr:hover { background: #f1f5f9!important; }\n\n/* ---------- 5. CADRE\
  \ DES GUIDES (markdown) ---------- */\n.dashboard-component-markdown,\n.dashboard-markdown\
  \ { background: #ffffff; border: 1px solid #e7ecf5; border-radius: 16px; box-shadow:\
  \ 0 1px 2px rgba(15,23,42,.05),0 12px 28px -20px rgba(15,23,42,.5); }\n\n/* ----------\
  \ 6. ONGLETS : tous visibles, style pilule ---------- */\n.dashboard-component-tabs>.ant-tabs>.ant-tabs-nav\
  \ { background: #ffffff; border: 1px solid #e7ecf5; border-radius: 14px; padding:\
  \ 6px 8px; box-shadow: 0 1px 2px rgba(15,23,42,.05); margin-bottom: 14px; }\n.dashboard-component-tabs>.ant-tabs>.ant-tabs-nav::before\
  \ { display: none!important; }\n.dashboard-component-tabs .ant-tabs-nav-wrap { white-space:\
  \ normal!important; overflow: visible!important; }\n.dashboard-component-tabs .ant-tabs-nav-list\
  \ { flex-wrap: wrap!important; transform: none!important; width: 100%; row-gap:\
  \ 6px; }\n.dashboard-component-tabs .ant-tabs-nav-operations { display: none!important;\
  \ }\n.dashboard-component-tabs .ant-tabs-ink-bar { display: none!important; }\n\
  .dashboard-component-tabs .ant-tabs-tab { visibility: visible!important; order:\
  \ 0!important; border: none!important; border-radius: 10px; padding: 6px 10px!important;\
  \ margin: 0 4px 0 0!important; font-weight: 600; font-size: 10.5px!important; transition:\
  \ .2s; }\n.dashboard-component-tabs .ant-tabs-tab:hover { background: #eff6ff; }\n\
  .dashboard-component-tabs .ant-tabs-tab.ant-tabs-tab-active { background: linear-gradient(135deg,#1d4ed8,#3b82f6)!important;\
  \ box-shadow: 0 6px 16px -8px rgba(29,78,216,.9)!important; }\n.dashboard-component-tabs\
  \ .ant-tabs-tab.ant-tabs-tab-active * { color: #ffffff!important; }\n\n/* --- Onglets\
  \ : largeur naturelle, pas d'etirement --- */\n.dashboard-component-tabs .ant-tabs-nav-list>.ant-tabs-tab\
  \ { flex: 0 0 auto!important; width: auto!important; min-width: 0!important; max-width:\
  \ none!important; }\n\n/* ==== 7. TABLEAUX - SYSTEME DE LISIBILITE (genere) ====\
  \ */\n.superset-chart-table table thead th { white-space: normal!important; vertical-align:\
  \ bottom!important; font-size: 10.5px!important; font-weight: 700!important; text-transform:\
  \ uppercase; letter-spacing: .4px; line-height: 1.3!important; padding: 8px 10px!important;\
  \ color: #475569!important; background: #f1f5f9!important; border-bottom: 2px solid\
  \ #cbd5e1!important; }\n.superset-chart-table table tbody td { padding: 7px 10px!important;\
  \ line-height: 1.45!important; border-bottom: 1px solid #eef2f7!important; color:\
  \ #334155!important; font-size: 12px!important; vertical-align: top!important; }\n\
  \n.superset-chart-table table tbody tr:hover { background: #f8fafc!important; }\n\
  .pvtTable thead th { font-size: 10.5px!important; font-weight: 700!important; letter-spacing:\
  \ .3px; color: #475569!important; background: #f1f5f9!important; padding: 7px 9px!important;\
  \ line-height: 1.3!important; }\n.pvtTable tbody th { font-size: 11.5px!important;\
  \ font-weight: 600!important; color: #0f172a!important; text-align: left!important;\
  \ background: #f8fafc!important; padding: 7px 9px!important; line-height: 1.35!important;\
  \ }\n.pvtTable tbody td { padding: 7px 9px!important; font-size: 12px!important;\
  \ font-variant-numeric: tabular-nums; color: #0f172a!important; border-bottom: 1px\
  \ solid #eef2f7!important; }\n.pvtTable tbody tr:hover { background: #f8fafc!important;\
  \ }\n\n/* --- Diagnostic \"Diagnostic  Taux de  Satisfaction \u2014 niveau de service,\
  \ volumes et action\" --- */\n.chart-slice[data-test-chart-name=\"Diagnostic  Taux\
  \ de  Satisfaction \u2014 niveau de service, volumes et action\"] table { width:\
  \ 100%!important; max-width: 100%!important; font-size: 12.5px!important; }\n\n\
  .chart-slice[data-test-chart-name=\"Diagnostic  Taux de  Satisfaction \u2014 niveau\
  \ de service, volumes et action\"] table thead th { white-space: normal!important;\
  \ vertical-align: bottom!important; font-size: 10.5px!important; font-weight: 700!important;\
  \ text-transform: uppercase; letter-spacing: .4px; line-height: 1.3!important; padding:\
  \ 9px 10px!important; color: #475569!important; background: #f1f5f9!important; border-bottom:\
  \ 2px solid #cbd5e1!important; }\n.chart-slice[data-test-chart-name=\"Diagnostic\
  \  Taux de  Satisfaction \u2014 niveau de service, volumes et action\"] table tbody\
  \ td { padding: 11px 10px!important; vertical-align: top!important; line-height:\
  \ 1.5!important; border-bottom: 1px solid #e9eef5!important; color: #334155!important;\
  \ overflow: hidden!important; }\n.chart-slice[data-test-chart-name=\"Diagnostic\
  \  Taux de  Satisfaction \u2014 niveau de service, volumes et action\"] table tbody\
  \ tr:last-child td { border-bottom: 0!important; }\n.chart-slice[data-test-chart-name=\"\
  Diagnostic  Taux de  Satisfaction \u2014 niveau de service, volumes et action\"\
  ] table tbody td:nth-child(1) { font-weight: 700!important; color: #0f172a!important;\
  \ font-size: 12.5px!important; padding-left: 16px!important; white-space: normal!important;\
  \ }\n.chart-slice[data-test-chart-name=\"Diagnostic  Taux de  Satisfaction \u2014\
  \ niveau de service, volumes et action\"] table tbody td:nth-child(3),\n.chart-slice[data-test-chart-name=\"\
  Diagnostic  Taux de  Satisfaction \u2014 niveau de service, volumes et action\"\
  ] table tbody td:nth-child(4),\n.chart-slice[data-test-chart-name=\"Diagnostic \
  \ Taux de  Satisfaction \u2014 niveau de service, volumes et action\"] table tbody\
  \ td:nth-child(5),\n.chart-slice[data-test-chart-name=\"Diagnostic  Taux de  Satisfaction\
  \ \u2014 niveau de service, volumes et action\"] table tbody td:nth-child(6),\n\
  .chart-slice[data-test-chart-name=\"Diagnostic  Taux de  Satisfaction \u2014 niveau\
  \ de service, volumes et action\"] table tbody td:nth-child(9) { font-variant-numeric:\
  \ tabular-nums; font-weight: 600!important; color: #0f172a!important; white-space:\
  \ nowrap!important; }\n.chart-slice[data-test-chart-name=\"Diagnostic  Taux de \
  \ Satisfaction \u2014 niveau de service, volumes et action\"] table tbody td:nth-child(7)\
  \ { font-weight: 700!important; font-size: 11px!important; letter-spacing: .3px;\
  \ color: #1e293b!important; white-space: normal!important; padding-right: 14px!important;\
  \ }\n.chart-slice[data-test-chart-name=\"Diagnostic  Taux de  Satisfaction \u2014\
  \ niveau de service, volumes et action\"] table tbody td:nth-child(8) { font-size:\
  \ 12px!important; color: #475569!important; line-height: 1.55!important; white-space:\
  \ normal!important; }\n\n.chart-slice[data-test-chart-name=\"Diagnostic  Taux de\
  \  Satisfaction \u2014 niveau de service, volumes et action\"] table tbody tr:hover\
  \ { filter: brightness(.98); }\n\n/* --- Diagnostic \"Diagnostic des d\xE9lais \u2014\
  \ tranche, volume et action\" --- */\n.chart-slice[data-test-chart-name=\"Diagnostic\
  \ des d\xE9lais \u2014 tranche, volume et action\"] table { width: 100%!important;\
  \ max-width: 100%!important; font-size: 12.5px!important; }\n\n.chart-slice[data-test-chart-name=\"\
  Diagnostic des d\xE9lais \u2014 tranche, volume et action\"] table thead th { white-space:\
  \ normal!important; vertical-align: bottom!important; font-size: 10.5px!important;\
  \ font-weight: 700!important; text-transform: uppercase; letter-spacing: .4px; line-height:\
  \ 1.3!important; padding: 9px 10px!important; color: #475569!important; background:\
  \ #f1f5f9!important; border-bottom: 2px solid #cbd5e1!important; }\n.chart-slice[data-test-chart-name=\"\
  Diagnostic des d\xE9lais \u2014 tranche, volume et action\"] table tbody td { padding:\
  \ 11px 10px!important; vertical-align: top!important; line-height: 1.5!important;\
  \ border-bottom: 1px solid #e9eef5!important; color: #334155!important; overflow:\
  \ hidden!important; }\n.chart-slice[data-test-chart-name=\"Diagnostic des d\xE9\
  lais \u2014 tranche, volume et action\"] table tbody tr:last-child td { border-bottom:\
  \ 0!important; }\n.chart-slice[data-test-chart-name=\"Diagnostic des d\xE9lais \u2014\
  \ tranche, volume et action\"] table tbody td:nth-child(1) { font-weight: 700!important;\
  \ color: #0f172a!important; font-size: 12.5px!important; padding-left: 16px!important;\
  \ white-space: normal!important; }\n.chart-slice[data-test-chart-name=\"Diagnostic\
  \ des d\xE9lais \u2014 tranche, volume et action\"] table tbody td:nth-child(3),\n\
  .chart-slice[data-test-chart-name=\"Diagnostic des d\xE9lais \u2014 tranche, volume\
  \ et action\"] table tbody td:nth-child(4),\n.chart-slice[data-test-chart-name=\"\
  Diagnostic des d\xE9lais \u2014 tranche, volume et action\"] table tbody td:nth-child(5),\n\
  .chart-slice[data-test-chart-name=\"Diagnostic des d\xE9lais \u2014 tranche, volume\
  \ et action\"] table tbody td:nth-child(6),\n.chart-slice[data-test-chart-name=\"\
