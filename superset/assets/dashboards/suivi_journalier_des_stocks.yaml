  /* ============================================================
     Superset 6 - complements (phase 7d)
     ============================================================ */
  /* Boutons de la barre de filtres en majuscules, comme sous Superset 1.5 */
  [data-test="filter-bar__apply-button"],
  [data-test="filter-bar__clear-button"] { text-transform: uppercase !important; }
  /* Onglets sur une seule ligne: Superset 6 ajoute 8 px de marge autour de chaque titre d'onglet */
  .dashboard-component-tabs .ant-tabs-nav-list > .ant-tabs-tab { margin: 0 2px 0 0 !important; }
  .dashboard-component-tabs .ant-tabs-tab .dragdroppable-tab { margin: 0 !important; }

  /* Bandeau de titre: le conteneur interne de Superset 6 est blanc par defaut */
  .dashboard-header-container .header-with-actions { background: transparent !important; }

  /* Bandeaux "En-tete - ...": Superset 6 dimensionne le graphique sans tenir compte de
     l'en-tete masque; on laisse le contenu deborder dans la tuile (88 px) au lieu de le couper */
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] div,
  .chart-slice[data-test-chart-name="En-tete - Ruptures"] div,
  .chart-slice[data-test-chart-name="En-tete - Synchronisation"] div { overflow: visible !important; height: auto !important; max-height: none !important; }
