dashboard_title: Suivi journalier des stocks
uuid: bf2d3933-6a81-4ee2-bfe0-38ac1c785e96
version: 1.0.0
description: null
slug: rapport_stock_rdc
css: |-
  /* ============================================================
     LOGIMEV - feuille Superset 6 (rework minimum viable, phase 7d)
     Les regles propres a un graphique sont cle'es sur
     .chart-slice[data-test-chart-name="<slice_name du YAML>"] et non plus
     sur l'id numerique (#chart-id-N / data-test-chart-id): les ids changent
     a chaque import (dev, UAT, prod), une regle cle'e sur un id finit par
     styler le mauvais graphique. Le nom (slice_name) est stable.
     Supprime: regles sur ids legacy (couleurs KPI par famille, largeurs de
     colonnes), teinte de ligne par Gravite (dependait du style inline de
     Superset 1.5), selecteurs DOM Superset 1.5 disparus.
     ============================================================ */

  /* ===== A. CHARTE LOGIMEV (bandeau + barre de filtres bleu marine) ===== */
  /* ============================================================
     Gestion des commandes - habillage repris de "Rapport d'etat de stock"
     ============================================================ */
  /* ====== THEME LOGIMEV - Rapport d'etat de stock ====== */

  /* --- Fond general bleu --- */
  body,
  #app,
  .dashboard,
  .dashboard-content,
  [data-test="dashboard-content-wrapper"],
  .grid-content,
  .dashboard .dashboard-grid,
  .dashboard-component-tabs-content,
  .grid-row,
  .dragdroppable-row { background-color: #4E93CF !important; }

  .grid-content { padding: 12px !important; }

  /* --- Bandeau de titre bleu fonce --- */
  .dashboard-header-container { background-color: #1F3864 !important; border-bottom: none !important; box-shadow: none !important; }

  .dashboard-header-container [data-test="editable-title-input"],
  .dashboard-header-container .title-panel .input-sizer { color: #FFFFFF !important; font-weight: 700 !important; font-size: 22px !important; background: transparent !important; }

  /* --- Onglets en paves --- */
  .dashboard .ant-tabs-nav { background: transparent !important; margin-bottom: 10px !important; }

  .dashboard .ant-tabs-nav::before { border-bottom: none !important; }

  .dashboard .ant-tabs-ink-bar { display: none !important; }

  .dashboard .ant-tabs-tab { background-color: #8FB8DE !important; border-radius: 4px 4px 0 0 !important; margin: 0 4px 0 0 !important; padding: 10px 14px !important; border: none !important; white-space: nowrap !important; }

  .dashboard .ant-tabs-tab .ant-tabs-tab-btn,
  .dashboard .ant-tabs-tab .ant-tabs-tab-btn * { color: #1F3864 !important; font-weight: 600 !important; font-size: 12px !important; text-transform: uppercase; white-space: nowrap !important; }

  .dashboard .ant-tabs-tab.ant-tabs-tab-active { background-color: #1F3864 !important; }

  .dashboard .ant-tabs-tab.ant-tabs-tab-active .ant-tabs-tab-btn,
  .dashboard .ant-tabs-tab.ant-tabs-tab-active .ant-tabs-tab-btn * { color: #FFFFFF !important; }

  /* --- Cartes de graphiques / tableaux --- */
  .dashboard-component-chart-holder { background-color: #FFFFFF !important; border: 1px solid #2E5C8A !important; border-radius: 6px !important; box-shadow: 0 2px 6px rgba(0,0,0,0.18) !important; padding: 6px 8px !important; }

  .dashboard-component-chart-holder .header-title,
  .dashboard-component-chart-holder .header-title span,
  [data-test="slice-header"] .header-title { color: #1F3864 !important; font-weight: 700 !important; text-align: center !important; width: 100% !important; }

  /* --- Blocs Markdown (en-tete / legende) --- */
  .dashboard-markdown { background-color: #FFFFFF !important; border: 1px solid #2E5C8A !important; border-radius: 6px !important; }

  /* --- Barre de filtres --- */
  [data-test="filter-bar"],
  [data-test="filter-bar"] > div,
  [data-test="filter-bar"] > div > div { background-color: #4E93CF !important; }

  [data-test="filter-bar"] h4,
  [data-test="filter-bar"] label,
  [data-test="filter-bar"] .ant-form-item-label > label { color: #FFFFFF !important; font-weight: 700 !important; }

  [data-test="filter-bar"] .ant-form-item { background-color: #1F3864 !important; border-radius: 6px !important; padding: 8px 10px 4px 10px !important; margin-bottom: 12px !important; }

  [data-test="filter-bar"] .ant-select-selector { border-radius: 4px !important; border: 1px solid #FFFFFF !important; background-color: #FFFFFF !important; }

  [data-test="filter-bar"] .ant-select-selection-placeholder,
  [data-test="filter-bar"] .ant-select-selection-item { color: #1F3864 !important; }

  [data-test="filter-bar__expand-button"] svg,
  [data-test="filter-bar__filter-icon"] svg { color: #FFFFFF !important; }

  /* --- Tableaux --- */
  .dashboard table thead th { background-color: #DCE6F1 !important; color: #1F3864 !important; font-weight: 700 !important; }

  .dashboard table tbody tr:nth-child(even) { background-color: #EEF4FB !important; }

  /* --- Boutons de la barre de filtres --- */
  [data-test="filter-bar__apply-button"] { background-color: #1F3864 !important; border-color: #1F3864 !important; color: #FFFFFF !important; font-weight: 700 !important; }

  [data-test="filter-bar__apply-button"] span { color: #FFFFFF !important; }

  [data-test="filter-bar__clear-button"],
  [data-test="filter-bar__clear-button"] span,
  [data-test="filter-bar"] .ant-btn-link span,
  [data-test="filter-bar"] [role="button"] { color: #FFFFFF !important; }

  /* --- Bouton Clear all : fond bleu marine, texte blanc --- */
  [data-test="filter-bar__clear-button"] { background-color: #1F3864 !important; border: 1px solid #1F3864 !important; border-radius: 4px !important; color: #FFFFFF !important; font-weight: 700 !important; }

  [data-test="filter-bar__clear-button"] span { color: #FFFFFF !important; }

  [data-test="filter-bar__clear-button"]:hover { background-color: #2E5C8A !important; border-color: #2E5C8A !important; color: #FFFFFF !important; }

  /* === RESPONSIVE === */
  /* --- fluidite generale --- */
  .dashboard .grid-content,
  .dashboard-content,
  .dashboard-component-chart-holder { max-width: 100% !important; }

  .dashboard-component-chart-holder .chart-container,
  .dashboard-component-chart-holder .slice_container { width: 100% !important; max-width: 100% !important; }

  .dashboard-component-chart-holder .superset-chart-table,
  .dashboard-component-chart-holder .chart-slice[data-test-viz-type="pivot_table_v2"] { overflow-x: auto !important; max-width: 100% !important; }

  /* --- barre de filtres : on recupere de la place sur petits ecrans --- */
  @media (max-width: 1100px) {

    [data-test="filter-bar"].open,
  div:has(> [data-test="filter-bar"].open) { width: 210px !important; min-width: 210px !important; flex: 0 0 210px !important; }
    [data-test="filter-bar"].open .ant-select { font-size: 11px !important; }

  }

  @media (max-width: 820px) {

    [data-test="filter-bar"].open,
  div:has(> [data-test="filter-bar"].open) { width: 175px !important; min-width: 175px !important; flex: 0 0 175px !important; }

  }

  /* === LISIBILITE & LIBELLES (9) === */
  .dashboard [data-test="slice-header"] .header-title,
  .dashboard [data-test="slice-header"] .header-title .editable-title { overflow: visible !important; text-overflow: clip !important; white-space: normal !important; }

  .dashboard [data-test="slice-header"] .header-title { height: auto !important; max-height: 42px; line-height: 1.2 !important; }

  .dashboard [data-test="slice-header"] { align-items: flex-start !important; }

  .dashboard .ant-tabs-nav .ant-tabs-tab { padding: 7px 11px !important; }

  .dashboard .ant-tabs-nav .ant-tabs-tab .editable-title,
  .dashboard .ant-tabs-nav .ant-tabs-tab span { font-size: 11.5px !important; letter-spacing: 0.2px !important; }

  .dashboard .ant-tabs-nav .ant-tabs-tab { padding: 7px 9px !important; }

  .dashboard .ant-tabs-nav .ant-tabs-tab .editable-title,
  .dashboard .ant-tabs-nav .ant-tabs-tab span { font-size: 10.5px !important; }

  /* ===== B. SYSTEME DE DESIGN v3 (cadres, KPI, onglets, tables) ===== */
  /* =====================================================================
     LOGIMEV - Systeme de design du tableau de bord  (v3)
     Cadres, en-tetes, cartes KPI, tables, onglets - valable sur TOUS les onglets
     ===================================================================== */

  /* ---------- 1. CADRE DES CARTES ---------- */
  .dashboard-component-chart-holder { position: relative; background: #ffffff; border: 1px solid #e7ecf5; border-radius: 16px; box-shadow: 0 1px 2px rgba(15,23,42,.05),0 12px 28px -20px rgba(15,23,42,.55); transition: box-shadow .28s ease,transform .28s ease,border-color .28s ease; }
  .dashboard-component-chart-holder:hover { border-color: #c7d2fe; transform: translateY(-2px); box-shadow: 0 2px 6px rgba(15,23,42,.07),0 26px 48px -24px rgba(37,99,235,.55); }
  .dashboard-component-chart-holder::after { content: ""; position: absolute; left: 16px; right: 16px; top: 0; height: 3px; z-index: 2; border-radius: 0 0 6px 6px; pointer-events: none; background: linear-gradient(90deg,#1d4ed8,#7c3aed 55%,#06b6d4); opacity: .9; }

  /* ---------- 2. EN-TETE DE CARTE (titre entier, jamais tronque) ---------- */
  .dashboard-component-chart-holder [data-test="slice-header"] { position: relative; height: auto!important; align-items: flex-start!important; padding-right: 2px; }
  .dashboard-component-chart-holder [data-test="slice-header"] .header-controls { position: absolute!important; top: 0; right: 0; z-index: 5; transform: scale(.75); transform-origin: top right; opacity: .5; transition: opacity .2s; }
  .dashboard-component-chart-holder:hover [data-test="slice-header"] .header-controls { opacity: 1; }
  .dashboard-component-chart-holder [data-test="slice-header"] .header-title { flex: 1 1 auto; min-width: 0; padding-right: 46px!important; max-height: none!important; -webkit-line-clamp: 4!important; overflow: visible!important; }
  .dashboard-component-chart-holder [data-test="slice-header"] .header-title .editable-title { display: block; white-space: normal!important; overflow: visible!important; text-overflow: clip!important; font-size: 11.5px!important; font-weight: 700!important; line-height: 1.25!important; letter-spacing: .15px; color: #0f172a!important; }

  /* ---------- 3. CARTES KPI ---------- */
  .chart-slice[data-test-viz-type="big_number_total"] { --kpi: #1d4ed8; --kpi-soft: #eff6ff; --kpi-ring: #dbeafe; }

  .chart-slice[data-test-viz-type="big_number_total"] .superset-legacy-chart-big-number { background: none!important; border-radius: 14px; padding: 2px 6px 8px!important; align-items: center!important; justify-content: center!important; }
  .chart-slice[data-test-viz-type="big_number_total"] .header-line { height: auto!important; line-height: 1.02!important; font-weight: 800!important; letter-spacing: -.02em; color: var(--kpi)!important; text-align: center!important; width: 100%; white-space: nowrap!important; font-size: 30px!important; }
  @media (min-width:1100px) {
  .chart-slice[data-test-viz-type="big_number_total"] .header-line { font-size: 36px!important; }
  }
  @media (min-width:1300px) {
  .chart-slice[data-test-viz-type="big_number_total"] .header-line { font-size: 44px!important; }
  }
  @media (min-width:1550px) {
  .chart-slice[data-test-viz-type="big_number_total"] .header-line { font-size: 54px!important; }
  }
  @media (min-width:1850px) {
  .chart-slice[data-test-viz-type="big_number_total"] .header-line { font-size: 62px!important; }
  }
  .chart-slice[data-test-viz-type="big_number_total"] .subheader-line { font-size: 11px!important; height: auto!important; line-height: 1.35!important; font-weight: 600!important; color: var(--kpi)!important; text-align: center!important; white-space: normal!important; width: fit-content; max-width: 96%; margin: 12px auto 0!important; padding: 6px 12px; background: #ffffffcc; border: 1px solid var(--kpi-ring); border-radius: 999px; }
  /* Teinte de fond + lisere colore, par famille d'indicateur */

  /* ---------- 4. TABLES ---------- */
  .dashboard-component-chart-holder .chart-container table th { background: #f8fafc!important; color: #0f172a!important; font-weight: 700!important; border-bottom: 2px solid #e2e8f0!important; letter-spacing: .2px; }
  .dashboard-component-chart-holder .chart-container table td { border-bottom: 1px solid #f1f5f9!important; }
  .dashboard-component-chart-holder .chart-container table tbody tr:hover { background: #f1f5f9!important; }

  /* ---------- 5. CADRE DES GUIDES (markdown) ---------- */
  .dashboard-component-markdown,
  .dashboard-markdown { background: #ffffff; border: 1px solid #e7ecf5; border-radius: 16px; box-shadow: 0 1px 2px rgba(15,23,42,.05),0 12px 28px -20px rgba(15,23,42,.5); }

  /* ---------- 6. ONGLETS : tous visibles, style pilule ---------- */
  .dashboard-component-tabs>.ant-tabs>.ant-tabs-nav { background: #ffffff; border: 1px solid #e7ecf5; border-radius: 14px; padding: 6px 8px; box-shadow: 0 1px 2px rgba(15,23,42,.05); margin-bottom: 14px; }
  .dashboard-component-tabs>.ant-tabs>.ant-tabs-nav::before { display: none!important; }
  .dashboard-component-tabs .ant-tabs-nav-wrap { white-space: normal!important; overflow: visible!important; }
  .dashboard-component-tabs .ant-tabs-nav-list { flex-wrap: wrap!important; transform: none!important; width: 100%; row-gap: 6px; }
  .dashboard-component-tabs .ant-tabs-nav-operations { display: none!important; }
  .dashboard-component-tabs .ant-tabs-ink-bar { display: none!important; }
  .dashboard-component-tabs .ant-tabs-tab { visibility: visible!important; order: 0!important; border: none!important; border-radius: 10px; padding: 6px 10px!important; margin: 0 4px 0 0!important; font-weight: 600; font-size: 10.5px!important; transition: .2s; }
  .dashboard-component-tabs .ant-tabs-tab:hover { background: #eff6ff; }
  .dashboard-component-tabs .ant-tabs-tab.ant-tabs-tab-active { background: linear-gradient(135deg,#1d4ed8,#3b82f6)!important; box-shadow: 0 6px 16px -8px rgba(29,78,216,.9)!important; }
  .dashboard-component-tabs .ant-tabs-tab.ant-tabs-tab-active * { color: #ffffff!important; }

  /* --- Onglets : largeur naturelle, pas d'etirement --- */
  .dashboard-component-tabs .ant-tabs-nav-list>.ant-tabs-tab { flex: 0 0 auto!important; width: auto!important; min-width: 0!important; max-width: none!important; }

  /* ==== 7. TABLEAUX - SYSTEME DE LISIBILITE (genere) ==== */
  .superset-chart-table table thead th { white-space: normal!important; vertical-align: bottom!important; font-size: 10.5px!important; font-weight: 700!important; text-transform: uppercase; letter-spacing: .4px; line-height: 1.3!important; padding: 8px 10px!important; color: #475569!important; background: #f1f5f9!important; border-bottom: 2px solid #cbd5e1!important; }
  .superset-chart-table table tbody td { padding: 7px 10px!important; line-height: 1.45!important; border-bottom: 1px solid #eef2f7!important; color: #334155!important; font-size: 12px!important; vertical-align: top!important; }

  .superset-chart-table table tbody tr:hover { background: #f8fafc!important; }
  .pvtTable thead th { font-size: 10.5px!important; font-weight: 700!important; letter-spacing: .3px; color: #475569!important; background: #f1f5f9!important; padding: 7px 9px!important; line-height: 1.3!important; }
  .pvtTable tbody th { font-size: 11.5px!important; font-weight: 600!important; color: #0f172a!important; text-align: left!important; background: #f8fafc!important; padding: 7px 9px!important; line-height: 1.35!important; }
  .pvtTable tbody td { padding: 7px 9px!important; font-size: 12px!important; font-variant-numeric: tabular-nums; color: #0f172a!important; border-bottom: 1px solid #eef2f7!important; }
  .pvtTable tbody tr:hover { background: #f8fafc!important; }

  /* ==== 8. TABLEAUX CROISES (pivot v2) ==== */
  .pvtTable { border-collapse: collapse!important; font-size: 12px!important; }
  .pvtTable th.pvtAxisLabel { font-size: 10px!important; text-transform: uppercase; letter-spacing: .4px; color: #64748b!important; background: #e2e8f0!important; font-weight: 700!important; padding: 6px 9px!important; text-align: left!important; }
  .pvtTable th.pvtColLabel,
  .pvtTable th.pvtTotalLabel { font-size: 10.5px!important; font-weight: 700!important; letter-spacing: .3px; color: #334155!important; background: #f1f5f9!important; padding: 7px 9px!important; line-height: 1.3!important; text-align: center!important; white-space: normal!important; }
  .pvtTable th.pvtRowLabel { font-size: 11.5px!important; font-weight: 600!important; color: #0f172a!important; background: #f8fafc!important; text-align: left!important; padding: 7px 9px!important; white-space: normal!important; }
  .pvtTable td.pvtVal { text-align: right!important; font-variant-numeric: tabular-nums; padding: 7px 9px!important; color: #0f172a!important; border-bottom: 1px solid #eef2f7!important; }
  .pvtTable td.pvtTotal,
  .pvtTable td.pvtGrandTotal { text-align: right!important; font-weight: 700!important; font-variant-numeric: tabular-nums; background: #f1f5f9!important; color: #0f172a!important; padding: 7px 9px!important; border-top: 2px solid #cbd5e1!important; }
  .pvtTable td.pvtGrandTotal { background: #e2e8f0!important; }
  .pvtTable tbody tr:hover td.pvtVal { background: #f8fafc!important; }

  /* --- tableaux croises : occuper toute la largeur de la tuile --- */
  .chart-slice[data-test-viz-type="pivot_table_v2"] div:has(> table.pvtTable),
  .chart-slice[data-test-viz-type="pivot_table_v2"] div:has(> div > table.pvtTable) { max-width: none!important; width: 100%!important; }
  .chart-slice[data-test-viz-type="pivot_table_v2"] table.pvtTable { width: 100%!important; }

  /* ============================================================
     RAPPORT DE STOCK - RDC : surcouche specifique
     ============================================================ */

  /* --- Bandeau de titre dynamique (chart "En-tete - Date du rapport") --- */
  .dashboard-component-chart-holder:has(.chart-slice[data-test-chart-name="En-tete - Date du rapport"]) { background: linear-gradient(90deg, #1F3864 0%, #2c4f8a 100%) !important; border: none !important; border-radius: 10px !important; box-shadow: 0 2px 6px rgba(15,23,42,.18) !important; padding: 0 !important; }
  .dashboard-component-chart-holder:has(.chart-slice[data-test-chart-name="En-tete - Date du rapport"]) .header-title,
  .dashboard-component-chart-holder:has(.chart-slice[data-test-chart-name="En-tete - Date du rapport"]) [data-test="slice-header"] { display: none !important; }
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] thead { display: none !important; }
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] table,
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] tbody tr,
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] tbody td { background: transparent !important; border: none !important; box-shadow: none !important; }
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] tbody td { color: #FFFFFF !important; font-size: 24px !important; font-weight: 800 !important; letter-spacing: .3px; text-align: left !important; padding: 14px 20px !important; white-space: nowrap; }
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] .pagination-container,
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] .dt-controls { display: none !important; }

  /* --- Bandeau KPI --- */
  .chart-slice[data-test-viz-type="big_number_total"] .header-line { color: #1F3864 !important; }
  .chart-slice[data-test-viz-type="big_number_total"] .subheader-line { color: #475569 !important; }

  /* --- Tableau du rapport --- */
  .chart-slice[data-test-chart-name="Rapport de stock"] table thead th { background: #1F3864 !important; color: #FFFFFF !important; font-weight: 700 !important; white-space: normal !important; }

  .chart-slice[data-test-chart-name="Rapport de stock"] table tbody td { font-size: 12.5px !important; }

  /* Statut : pastilles de couleur */
  .chart-slice[data-test-chart-name="Rapport de stock"] td[data-column-name="Statut"] { font-weight: 600 !important; }

  /* --- Corrections rapport de stock --- */
  .chart-slice[data-test-chart-name="Rapport de stock"] table thead th { text-transform: none !important; font-size: 12.5px !important; }
  .dashboard-component-chart-holder:has(.chart-slice[data-test-chart-name="En-tete - Date du rapport"]) [data-test="slice-header"] { display: none !important; }
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] .superset-legacy-chart-table,
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] .chart-container { display: flex !important; align-items: center !important; height: 100% !important; }
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] .dt-metric,
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] .dt-is-filter { cursor: default !important; }

  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] thead th { color: transparent !important; background: transparent !important; border: none !important; font-size: 0 !important; line-height: 0 !important; height: 0 !important; padding: 0 !important; }
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] thead th span,
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] thead th svg { display: none !important; }
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] tbody tr,
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] tbody td { visibility: visible !important; }

  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] thead { display: table-header-group !important; }
  .chart-slice[data-test-chart-name="En-tete - Date du rapport"] table { visibility: visible !important; }

  /* ================= HARMONISATION CHARTE GESTION DES COMMANDES ================= */

  /* Tableau : entete claire facon Gestion des commandes */
  .chart-slice[data-test-chart-name="Rapport de stock"] table thead th { background: #f1f5f9 !important; color: #475569 !important; font-size: 10.5px !important; font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: .4px !important; padding: 9px 10px !important; border-bottom: 2px solid #cbd5e1 !important; white-space: normal !important; vertical-align: bottom !important; }
  .chart-slice[data-test-chart-name="Rapport de stock"] table { width: 100% !important; max-width: 100% !important; font-size: 12.5px !important; }

  .chart-slice[data-test-chart-name="Rapport de stock"] table tbody td { font-size: 12.5px !important; padding: 11px 10px 11px 16px !important; border-bottom: 1px solid #e9eef5 !important; white-space: normal !important; line-height: 1.5 !important; }

  /* Coloration des lignes selon la gravite: supprimee (Superset 6 n'ecrit plus la couleur en style inline; la colonne Gravite reste visible avec ses couleurs) */

  /* Restaure la couleur KPI par carte (var --kpi) */
  .chart-slice[data-test-viz-type="big_number_total"] .header-line { color: var(--kpi) !important; }
  .chart-slice[data-test-viz-type="big_number_total"] .subheader-line { color: var(--kpi) !important; border-color: var(--kpi-ring) !important; }

  /* ===== Tableau : quadrillage / delimitation des cellules ===== */
  .chart-slice[data-test-chart-name="Rapport de stock"] table { border-collapse: separate !important; border-spacing: 0 !important; border: 1px solid #cbd5e1 !important; border-radius: 6px !important; overflow: hidden !important; }
