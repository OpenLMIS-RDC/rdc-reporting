      label: Niveau de service (du plus grave au moins grave)
      optionName: col_9ndecjxw
      sqlExpression: CASE WHEN COALESCE(quantite_demandee,0)=0 THEN '6. Taux non calculable (demande nulle)'
        WHEN COALESCE(quantite_livree,0) > quantite_demandee THEN '5. Sur-livraison (livré > demandé)'
        WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 50 THEN '1. Service critique (< 50
        %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 80 THEN '2. Service dégradé (50
        – 79 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 95 THEN '3. Service acceptable
        (80 – 94 %)' ELSE '4. Service conforme (≥ 95 %)' END
      sqlExpressionType: SIMPLE
