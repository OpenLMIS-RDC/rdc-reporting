    expressionType: SQL
    hasCustomLabel: true
    label: Structures
    optionName: m_raasgekr
    sqlExpression: COUNT(DISTINCT structure)
    sqlExpressionType: SIMPLE
  - aggregate: null
    column: null
    expressionType: SQL
    hasCustomLabel: true
    label: Produits
    optionName: m_gh9dgcig
    sqlExpression: COUNT(DISTINCT nom_du_produit)
    sqlExpressionType: SIMPLE
  - aggregate: null
    column: null
    expressionType: SQL
    hasCustomLabel: true
    label: "Quantit\xE9 non livr\xE9e"
    optionName: m_otrjyxp1
    sqlExpression: SUM(greatest(COALESCE(quantite_demandee,0)-COALESCE(quantite_livree,0),0))
    sqlExpressionType: SIMPLE
  - aggregate: null
    column: null
    expressionType: SQL
    hasCustomLabel: true
    label: "Niveau d\u2019urgence"
    optionName: m_id7hg1z3
    sqlExpression: "MAX(CASE (CASE WHEN COALESCE(quantite_demandee,0)=0 THEN '6. Taux\
      \ non calculable (demande nulle)' WHEN COALESCE(quantite_livree,0) > quantite_demandee\
      \ THEN '5. Sur-livraison (livr\xE9 > demand\xE9)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee\
      \ < 50 THEN '1. Service critique (< 50 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee\
      \ < 80 THEN '2. Service d\xE9grad\xE9 (50 \u2013 79 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee\
      \ < 95 THEN '3. Service acceptable (80 \u2013 94 %)' ELSE '4. Service conforme\
      \ (\u2265 95 %)' END)\n WHEN '1. Service critique (< 50 %)' THEN '\U0001F534\
      \ 1 \xB7 CRITIQUE'\n WHEN '2. Service d\xE9grad\xE9 (50 \u2013 79 %)' THEN '\U0001F7E0\
      \ 2 \xB7 URGENT'\n WHEN '3. Service acceptable (80 \u2013 94 %)' THEN '\U0001F7E1\
      \ 3 \xB7 VIGILANCE'\n WHEN '4. Service conforme (\u2265 95 %)' THEN '\U0001F7E2\
      \ 4 \xB7 CONFORME'\n WHEN '5. Sur-livraison (livr\xE9 > demand\xE9)' THEN '\U0001F535\
      \ 5 \xB7 \xC0 CONTR\xD4LER'\n WHEN '6. Taux non calculable (demande nulle)'\
      \ THEN '\u26AA 6 \xB7 \xC0 QUALIFIER'\n ELSE '\u26AB 9 \xB7 \xC0 V\xC9RIFIER'\
      \ END)"
    sqlExpressionType: SIMPLE
  - aggregate: null
    column: null
    expressionType: SQL
    hasCustomLabel: true
    label: Propositions d'actions
    optionName: m_7miygsen
    sqlExpression: "MAX(CASE (CASE WHEN COALESCE(quantite_demandee,0)=0 THEN '6. Taux\
      \ non calculable (demande nulle)' WHEN COALESCE(quantite_livree,0) > quantite_demandee\
      \ THEN '5. Sur-livraison (livr\xE9 > demand\xE9)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee\
      \ < 50 THEN '1. Service critique (< 50 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee\
      \ < 80 THEN '2. Service d\xE9grad\xE9 (50 \u2013 79 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee\
      \ < 95 THEN '3. Service acceptable (80 \u2013 94 %)' ELSE '4. Service conforme\
      \ (\u2265 95 %)' END)\n WHEN '1. Service critique (< 50 %)' THEN 'V\xE9rifier\
      \ la disponibilit\xE9 chez l\u2019approvisionneur, puis remonter la commande\
      \ au niveau central. Croiser avec l\u2019onglet Statut des commandes pour \xE9\
      carter un simple retard.'\n WHEN '2. Service d\xE9grad\xE9 (50 \u2013 79 %)'\
      \ THEN 'Identifier les produits qui portent l\u2019essentiel de l\u2019\xE9\
      cart dans le tableau de d\xE9tail et les inscrire en priorit\xE9 sur la prochaine\
      \ commande.'\n WHEN '3. Service acceptable (80 \u2013 94 %)' THEN 'Pas d\u2019\
      urgence. Traiter au cycle de commande habituel et surveiller la r\xE9p\xE9tition\
      \ du m\xEAme produit d\u2019un mois sur l\u2019autre.'\n WHEN '4. Service conforme\
      \ (\u2265 95 %)' THEN 'Aucune action. Maintenir le rythme de commande et la\
      \ r\xE9gularit\xE9 de la saisie des livraisons.'\n WHEN '5. Sur-livraison (livr\xE9\
      \ > demand\xE9)' THEN 'Contr\xF4ler les bons de livraison : le plus souvent\
      \ une unit\xE9 de conditionnement mal saisie. Corriger \xE0 la source avant\
      \ d\u2019exploiter le taux.'\n WHEN '6. Taux non calculable (demande nulle)'\
      \ THEN 'V\xE9rifier que les r\xE9quisitions de la structure sont bien remont\xE9\
      es sur la p\xE9riode. Sinon retirer la structure du p\xE9rim\xE8tre plut\xF4\
      t que de la compter \xE0 0 %.'\n ELSE 'Qualifier la situation avant toute action.'\
      \ END)"
    sqlExpressionType: SIMPLE
  order_by_cols: []
  order_desc: false
  percent_metrics:
  - aggregate: null
    column: null
