    - aggregate: null
      column: null
      expressionType: SQL
      hasCustomLabel: true
      label: Niveau d’urgence
      optionName: m_id7hg1z3
      sqlExpression: |-
        MAX(CASE (CASE WHEN COALESCE(quantite_demandee,0)=0 THEN '6. Taux non calculable (demande nulle)' WHEN COALESCE(quantite_livree,0) > quantite_demandee THEN '5. Sur-livraison (livré > demandé)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 50 THEN '1. Service critique (< 50 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 80 THEN '2. Service dégradé (50 – 79 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 95 THEN '3. Service acceptable (80 – 94 %)' ELSE '4. Service conforme (≥ 95 %)' END)
         WHEN '1. Service critique (< 50 %)' THEN '🔴 1 · CRITIQUE'
         WHEN '2. Service dégradé (50 – 79 %)' THEN '🟠 2 · URGENT'
         WHEN '3. Service acceptable (80 – 94 %)' THEN '🟡 3 · VIGILANCE'
         WHEN '4. Service conforme (≥ 95 %)' THEN '🟢 4 · CONFORME'
         WHEN '5. Sur-livraison (livré > demandé)' THEN '🔵 5 · À CONTRÔLER'
         WHEN '6. Taux non calculable (demande nulle)' THEN '⚪ 6 · À QUALIFIER'
         ELSE '⚫ 9 · À VÉRIFIER' END)
      sqlExpressionType: SIMPLE
    - aggregate: null
      column: null
      expressionType: SQL
      hasCustomLabel: true
      label: Propositions d'actions
      optionName: m_7miygsen
      sqlExpression: |-
        MAX(CASE (CASE WHEN COALESCE(quantite_demandee,0)=0 THEN '6. Taux non calculable (demande nulle)' WHEN COALESCE(quantite_livree,0) > quantite_demandee THEN '5. Sur-livraison (livré > demandé)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 50 THEN '1. Service critique (< 50 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 80 THEN '2. Service dégradé (50 – 79 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 95 THEN '3. Service acceptable (80 – 94 %)' ELSE '4. Service conforme (≥ 95 %)' END)
         WHEN '1. Service critique (< 50 %)' THEN 'Vérifier la disponibilité chez l’approvisionneur, puis remonter la commande au niveau central. Croiser avec l’onglet Statut des commandes pour écarter un simple retard.'
         WHEN '2. Service dégradé (50 – 79 %)' THEN 'Identifier les produits qui portent l’essentiel de l’écart dans le tableau de détail et les inscrire en priorité sur la prochaine commande.'
         WHEN '3. Service acceptable (80 – 94 %)' THEN 'Pas d’urgence. Traiter au cycle de commande habituel et surveiller la répétition du même produit d’un mois sur l’autre.'
         WHEN '4. Service conforme (≥ 95 %)' THEN 'Aucune action. Maintenir le rythme de commande et la régularité de la saisie des livraisons.'
         WHEN '5. Sur-livraison (livré > demandé)' THEN 'Contrôler les bons de livraison : le plus souvent une unité de conditionnement mal saisie. Corriger à la source avant d’exploiter le taux.'
         WHEN '6. Taux non calculable (demande nulle)' THEN 'Vérifier que les réquisitions de la structure sont bien remontées sur la période. Sinon retirer la structure du périmètre plutôt que de la compter à 0 %.'
         ELSE 'Qualifier la situation avant toute action.' END)
      sqlExpressionType: SIMPLE
