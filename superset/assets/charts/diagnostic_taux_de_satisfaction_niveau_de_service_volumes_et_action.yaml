  groupby:
  - aggregate: null
    column: null
    expressionType: SQL
    hasCustomLabel: true
    label: Niveau de service (du plus grave au moins grave)
    optionName: col_9ndecjxw
    sqlExpression: "CASE WHEN COALESCE(quantite_demandee,0)=0 THEN '6. Taux non calculable\
      \ (demande nulle)' WHEN COALESCE(quantite_livree,0) > quantite_demandee THEN\
      \ '5. Sur-livraison (livr\xE9 > demand\xE9)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee\
      \ < 50 THEN '1. Service critique (< 50 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee\
      \ < 80 THEN '2. Service d\xE9grad\xE9 (50 \u2013 79 %)' WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee\
      \ < 95 THEN '3. Service acceptable (80 \u2013 94 %)' ELSE '4. Service conforme\
      \ (\u2265 95 %)' END"
    sqlExpressionType: SIMPLE
  include_search: false
  metrics:
  - aggregate: null
    column: null
    expressionType: SQL
    hasCustomLabel: true
    label: "Gravit\xE9"
    optionName: m_grav_lvl1
    sqlExpression: MIN(CASE WHEN COALESCE(quantite_demandee,0)=0 THEN 6 WHEN COALESCE(quantite_livree,0)
      > quantite_demandee THEN 5 WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee
      < 50 THEN 1 WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 80 THEN
      2 WHEN COALESCE(quantite_livree,0)*100.0/quantite_demandee < 95 THEN 3 ELSE
      4 END)
    sqlExpressionType: SIMPLE
  - aggregate: null
    column: null
    expressionType: SQL
    hasCustomLabel: true
