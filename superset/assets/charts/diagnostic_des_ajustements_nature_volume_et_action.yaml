      \ 'Ajustement Inventaire (-)' THEN 5 WHEN 'Donation Recue' THEN 6 WHEN 'Donation\
      \ Sortante' THEN 6 ELSE 9 END)\n WHEN 1 THEN '\U0001F534 1 \xB7 CRITIQUE'\n\
      \ WHEN 2 THEN '\U0001F7E0 2 \xB7 URGENT'\n WHEN 3 THEN '\U0001F7E0 3 \xB7 URGENT'\n\
      \ WHEN 4 THEN '\U0001F7E1 4 \xB7 QUALIT\xC9 DE DONN\xC9E'\n WHEN 5 THEN '\U0001F7E2\
      \ 5 \xB7 NORMAL'\n WHEN 6 THEN '\U0001F535 6 \xB7 \xC0 TRACER'\n ELSE '\u26AA\
      \ 9 \xB7 \xC0 QUALIFIER' END)"
    label: "Niveau d\u2019urgence"
    hasCustomLabel: true
    optionName: m_i3lppteg
    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
  - expressionType: SQL
    sqlExpression: "MAX(CASE (CASE raison_ajustement WHEN 'Vol ou Disparition' THEN\
      \ 1 WHEN 'Peremption' THEN 2 WHEN 'Avarie' THEN 3 WHEN 'Correction (+)' THEN\
      \ 4 WHEN 'Correction (-)' THEN 4 WHEN 'Ajustement Inventaire (+)' THEN 5 WHEN\
      \ 'Ajustement Inventaire (-)' THEN 5 WHEN 'Donation Recue' THEN 6 WHEN 'Donation\
      \ Sortante' THEN 6 ELSE 9 END)\n WHEN 1 THEN 'Perte non justifi\xE9e : probl\xE8\
      me de s\xE9curit\xE9 ou de tra\xE7abilit\xE9. D\xE9clencher un contr\xF4le sur\
      \ place et un inventaire contradictoire ; documenter chaque \xE9cart avant toute\
      \ nouvelle dotation.'\n WHEN 2 THEN 'Sur-dotation ou rotation d\xE9faillante\
      \ en amont. Suspendre les commandes du produit concern\xE9, red\xE9ployer les\
      \ lots proches de la date limite et revoir le calibrage \xE0 partir de la consommation\
      \ r\xE9elle.'\n WHEN 3 THEN 'Probl\xE8me de conditionnement, de transport ou\
      \ de stockage. V\xE9rifier les conditions de transport et la cha\xEEne du froid\
      \ le cas \xE9ch\xE9ant, puis corriger le circuit avant la prochaine exp\xE9\
      dition.'\n WHEN 4 THEN 'La qualit\xE9 de la donn\xE9e est en cause, pas le stock.\
      \ Aucune urgence produit : reprendre la formation \xE0 la saisie sur les structures\
      \ concern\xE9es et v\xE9rifier les unit\xE9s de conditionnement utilis\xE9es.'\n\
      \ WHEN 5 THEN 'Le stock th\xE9orique est remis au niveau du stock physique.\
      \ Maintenir le rythme d\u2019inventaire : l\u2019absence totale d\u2019ajustement\
      \ est plus suspecte qu\u2019un ajustement mod\xE9r\xE9.'\n WHEN 6 THEN 'Entr\xE9\
      e ou sortie hors circuit d\u2019approvisionnement. V\xE9rifier que le mouvement\
      \ est document\xE9 et que le produit est int\xE9gr\xE9 au plan de distribution\
      \ avant la prochaine dotation.'\n ELSE 'Type d\u2019ajustement non reconnu :\
      \ qualifier la raison saisie avant toute interpr\xE9tation.' END)"
