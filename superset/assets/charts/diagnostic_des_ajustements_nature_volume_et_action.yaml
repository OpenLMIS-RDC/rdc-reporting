  - expressionType: SQL
    sqlExpression: "CASE (CASE raison_ajustement WHEN 'Vol ou Disparition' THEN 1\
      \ WHEN 'Peremption' THEN 2 WHEN 'Avarie' THEN 3 WHEN 'Correction (+)' THEN 4\
      \ WHEN 'Correction (-)' THEN 4 WHEN 'Ajustement Inventaire (+)' THEN 5 WHEN\
      \ 'Ajustement Inventaire (-)' THEN 5 WHEN 'Donation Recue' THEN 6 WHEN 'Donation\
      \ Sortante' THEN 6 ELSE 9 END) WHEN 1 THEN '1. Vol ou disparition \u2014 perte\
      \ r\xE9elle' WHEN 2 THEN '2. P\xE9remption \u2014 perte r\xE9elle' WHEN 3 THEN\
      \ '3. Avarie \u2014 perte r\xE9elle' WHEN 4 THEN '4. Correction de saisie' WHEN\
      \ 5 THEN '5. \xC9cart d\u2019inventaire' WHEN 6 THEN '6. Mouvement de don' ELSE\
      \ '9. Type \xE0 qualifier' END"
    label: "Nature de l\u2019ajustement (du plus grave au moins grave)"
