        MAX(CASE (CASE raison_ajustement WHEN 'Vol ou Disparition' THEN 1 WHEN 'Peremption' THEN 2 WHEN 'Avarie' THEN 3 WHEN 'Correction (+)' THEN 4 WHEN 'Correction (-)' THEN 4 WHEN 'Ajustement Inventaire (+)' THEN 5 WHEN 'Ajustement Inventaire (-)' THEN 5 WHEN 'Donation Recue' THEN 6 WHEN 'Donation Sortante' THEN 6 ELSE 9 END)
         WHEN 1 THEN '🔴 1 · CRITIQUE'
         WHEN 2 THEN '🟠 2 · URGENT'
         WHEN 3 THEN '🟠 3 · URGENT'
         WHEN 4 THEN '🟡 4 · QUALITÉ DE DONNÉE'
         WHEN 5 THEN '🟢 5 · NORMAL'
         WHEN 6 THEN '🔵 6 · À TRACER'
         ELSE '⚪ 9 · À QUALIFIER' END)
      label: Niveau d’urgence
      hasCustomLabel: true
      optionName: m_i3lppteg
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE (CASE raison_ajustement WHEN 'Vol ou Disparition' THEN 1 WHEN 'Peremption' THEN 2 WHEN 'Avarie' THEN 3 WHEN 'Correction (+)' THEN 4 WHEN 'Correction (-)' THEN 4 WHEN 'Ajustement Inventaire (+)' THEN 5 WHEN 'Ajustement Inventaire (-)' THEN 5 WHEN 'Donation Recue' THEN 6 WHEN 'Donation Sortante' THEN 6 ELSE 9 END)
         WHEN 1 THEN 'Perte non justifiée : problème de sécurité ou de traçabilité. Déclencher un contrôle sur place et un inventaire contradictoire ; documenter chaque écart avant toute nouvelle dotation.'
         WHEN 2 THEN 'Sur-dotation ou rotation défaillante en amont. Suspendre les commandes du produit concerné, redéployer les lots proches de la date limite et revoir le calibrage à partir de la consommation réelle.'
         WHEN 3 THEN 'Problème de conditionnement, de transport ou de stockage. Vérifier les conditions de transport et la chaîne du froid le cas échéant, puis corriger le circuit avant la prochaine expédition.'
         WHEN 4 THEN 'La qualité de la donnée est en cause, pas le stock. Aucune urgence produit : reprendre la formation à la saisie sur les structures concernées et vérifier les unités de conditionnement utilisées.'
         WHEN 5 THEN 'Le stock théorique est remis au niveau du stock physique. Maintenir le rythme d’inventaire : l’absence totale d’ajustement est plus suspecte qu’un ajustement modéré.'
         WHEN 6 THEN 'Entrée ou sortie hors circuit d’approvisionnement. Vérifier que le mouvement est documenté et que le produit est intégré au plan de distribution avant la prochaine dotation.'
         ELSE 'Type d’ajustement non reconnu : qualifier la raison saisie avant toute interprétation.' END)
      label: Propositions d'actions
      hasCustomLabel: true
      optionName: m_e88r39si
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
