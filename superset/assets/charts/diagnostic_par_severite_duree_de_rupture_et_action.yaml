  metrics:
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE severite_rupture
         WHEN '0. Aucune rupture' THEN 4
         WHEN '1. Rupture totale (100 %)' THEN 1
         WHEN '2. Rupture majeure (50-99 %)' THEN 2
         WHEN '3. Rupture partielle (< 50 %)' THEN 3
         WHEN '4. Non observé' THEN 6
         ELSE 7 END)
      label: Gravité
      hasCustomLabel: true
      optionName: m_grav_132
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
