      \ WHEN '2. Rupture majeure (50-99 %)' THEN '\U0001F7E0 URGENT'\n WHEN '3. Rupture\
      \ partielle (< 50 %)' THEN '\U0001F7E1 VIGILANCE'\n WHEN '4. Non observ\xE9\
      ' THEN '\u26AA DONN\xC9E MANQUANTE'\n ELSE '\u26AB \xC0 V\xC9RIFIER' END)"
    label: "Niveau d\u2019urgence"
    hasCustomLabel: true
    optionName: m_bvzco07s
    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
  - expressionType: SQL
    sqlExpression: "MAX(CASE severite_rupture\n WHEN '0. Aucune rupture' THEN 'Disponibilit\xE9\
      \ continue sur toute la fen\xEAtre observ\xE9e. Maintenir le rythme de commande\
      \ actuel.'\n WHEN '1. Rupture totale (100 %)' THEN 'Produit indisponible sur\
      \ 100 % du temps observ\xE9 : commande d\u2019urgence et recherche d\u2019une\
      \ source de d\xE9pannage. V\xE9rifier aussi que la structure saisit bien ses\
      \ mouvements, une fen\xEAtre tr\xE8s courte exag\xE8re la s\xE9v\xE9rit\xE9\
      .'\n WHEN '2. Rupture majeure (50-99 %)' THEN 'Indisponible plus de la moiti\xE9\
      \ du temps : augmenter la quantit\xE9 command\xE9e et raccourcir le cycle de\
      \ r\xE9approvisionnement.'\n WHEN '3. Rupture partielle (< 50 %)' THEN 'Ruptures\
      \ ponctuelles : relever le stock de s\xE9curit\xE9 et avancer le point de commande\
      \ pour absorber les d\xE9lais de livraison.'\n WHEN '4. Non observ\xE9' THEN\
      \ 'Aucun jour observ\xE9 : la structure n\u2019a rien saisi sur la p\xE9riode.\
      \ Corriger le rapportage avant toute interpr\xE9tation du taux.'\n ELSE 'S\xE9\
      v\xE9rit\xE9 non reconnue : signaler \xE0 l\u2019\xE9quipe donn\xE9es.' END)"
    label: Propositions d'actions
    hasCustomLabel: true
