      label: Structures
      hasCustomLabel: true
      optionName: m_to0u7qx3
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE severite_rupture
         WHEN '0. Aucune rupture' THEN '🟢 CONFORME'
         WHEN '1. Rupture totale (100 %)' THEN '🔴 CRITIQUE'
         WHEN '2. Rupture majeure (50-99 %)' THEN '🟠 URGENT'
         WHEN '3. Rupture partielle (< 50 %)' THEN '🟡 VIGILANCE'
         WHEN '4. Non observé' THEN '⚪ DONNÉE MANQUANTE'
         ELSE '⚫ À VÉRIFIER' END)
      label: Niveau d’urgence
      hasCustomLabel: true
      optionName: m_bvzco07s
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE severite_rupture
         WHEN '0. Aucune rupture' THEN 'Disponibilité continue sur toute la fenêtre observée. Maintenir le rythme de commande actuel.'
         WHEN '1. Rupture totale (100 %)' THEN 'Produit indisponible sur 100 % du temps observé : commande d’urgence et recherche d’une source de dépannage. Vérifier aussi que la structure saisit bien ses mouvements, une fenêtre très courte exagère la sévérité.'
         WHEN '2. Rupture majeure (50-99 %)' THEN 'Indisponible plus de la moitié du temps : augmenter la quantité commandée et raccourcir le cycle de réapprovisionnement.'
         WHEN '3. Rupture partielle (< 50 %)' THEN 'Ruptures ponctuelles : relever le stock de sécurité et avancer le point de commande pour absorber les délais de livraison.'
         WHEN '4. Non observé' THEN 'Aucun jour observé : la structure n’a rien saisi sur la période. Corriger le rapportage avant toute interprétation du taux.'
         ELSE 'Sévérité non reconnue : signaler à l’équipe données.' END)
      label: Propositions d'actions
      hasCustomLabel: true
      optionName: m_qkagu4gu
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
