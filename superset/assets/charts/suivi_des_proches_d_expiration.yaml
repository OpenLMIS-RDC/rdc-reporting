slice_name: Suivi des proches d'expiration
viz_type: table
uuid: 4e8f3ef0-efba-43b6-a46e-8db8e1d16e7d
version: 1.0.0
dataset_uuid: 8c994ec6-0cc7-4601-a021-28a32372771a
description: null
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: table
  query_mode: raw
  all_columns:
    - structure
    - programme
    - nom_produit
    - date_expiration
    - unite_du_produit
    - qte_expirant_30j
    - qte_expirant_60j
    - qte_expirant_90j
    - valeur_usd_30j
    - expressionType: SQL
      sqlExpression: (dateDiff('day', today(), toDate(date_expiration)))
      label: jours_avant_expiration
    - expressionType: SQL
      sqlExpression: CASE WHEN toDate(date_expiration) < today() THEN '0. Déjà expiré' WHEN dateDiff('day',
        today(), toDate(date_expiration)) <= 30 THEN '1. ≤ 30 j' WHEN dateDiff('day', today(), toDate(date_expiration))
        <= 60 THEN '2. 31-60 j' WHEN dateDiff('day', today(), toDate(date_expiration)) <= 90 THEN '3.
        61-90 j' ELSE '4. > 90 j' END
      label: horizon_expiration
  order_by_cols:
    - '["jours_avant_expiration",true]'
  adhoc_filters: []
  row_limit: 1000
  server_pagination: false
  page_length: 25
  include_search: true
  allow_rearrange_columns: true
  show_cell_bars: true
  align_pn: false
  color_pn: false
  table_timestamp_format: smart_date
  time_range: No filter
  column_config:
    qte_expirant_30j:
      d3NumberFormat: ',d'
      horizontalAlign: right
    qte_expirant_60j:
      d3NumberFormat: ',d'
      horizontalAlign: right
    qte_expirant_90j:
      d3NumberFormat: ',d'
      horizontalAlign: right
    valeur_usd_30j:
      d3NumberFormat: $,.2f
      horizontalAlign: right
    jours_avant_expiration:
      d3NumberFormat: ',d'
      horizontalAlign: right
  conditional_formatting:
    - column: jours_avant_expiration
      operator: <
      targetValue: 0
      colorScheme: '#A93226'
    - column: qte_expirant_30j
      operator: '>'
      targetValue: 0
      colorScheme: '#E67E22'
  allow_render_html: true
query_context: null
