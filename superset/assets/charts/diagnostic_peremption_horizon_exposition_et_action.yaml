         WHEN 0 THEN '⚫ PERTE ACQUISE'
         WHEN 1 THEN '🔴 CRITIQUE'
         WHEN 2 THEN '🟠 URGENT'
         WHEN 3 THEN '🟡 SURVEILLANCE'
         ELSE '🟢 SANS RISQUE IMMÉDIAT' END)
