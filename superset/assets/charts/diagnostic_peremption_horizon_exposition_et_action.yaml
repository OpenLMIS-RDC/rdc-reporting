         WHEN 0 THEN 'Lots déjà périmés : lancer la procédure de retrait et de destruction, documenter la perte dans l’onglet Taux de perte et analyser la cause pour éviter la répétition.'
         WHEN 1 THEN 'Écouler en priorité selon le FEFO ou redéployer immédiatement vers une structure à forte consommation. Passé ce délai la perte est quasi certaine.'
         WHEN 2 THEN 'Lancer le redéploiement inter-structures maintenant : le délai de validation et de transport consomme l’essentiel de la marge restante.'
         WHEN 3 THEN 'Mettre sous surveillance, geler toute nouvelle commande de ce produit pour cette structure et préparer un plan d’écoulement.'
