      hasCustomLabel: true
      optionName: m_oo39yvls
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE statut_disponibilite
         WHEN '1. Stock disponible' THEN '🟢 CONFORME'
         WHEN '2. Rupture confirmée' THEN '🔴 CRITIQUE'
         WHEN '3. Pas de données' THEN '🟠 ANGLE MORT'
         ELSE '⚪ À VÉRIFIER' END)
      label: Niveau d’urgence
      hasCustomLabel: true
      optionName: m_5vx7hi4c
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE statut_disponibilite
         WHEN '1. Stock disponible' THEN 'Rien à faire. Ces couples structure × produit constituent le vivier mobilisable pour un redéploiement vers les ruptures confirmées.'
         WHEN '2. Rupture confirmée' THEN 'Rupture réelle et vérifiée : c’est le seul périmètre sur lequel dimensionner une commande. Traiter produit par produit en partant du Top 15 ci-dessous.'
         WHEN '3. Pas de données' THEN 'Ce n’est pas une rupture mais une absence de fiche de stock. Relancer les structures concernées : tant que cette part reste élevée, aucun autre indicateur de l’onglet n’est fiable.'
         ELSE 'Statut non reconnu : signaler à l’équipe données.' END)
      label: Propositions d'actions
      hasCustomLabel: true
      optionName: m_a141bwza
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
