      optionName: m_yteq3jhc
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT produit)
      label: Produits
      hasCustomLabel: true
      optionName: m_l8hyb3c8
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE etat_stock
         WHEN 'Rupture' THEN '🔴 1 · CRITIQUE'
         WHEN 'Potentielle rupture' THEN '🟠 2 · URGENT'
         WHEN 'Sous-stock' THEN '🟡 3 · VIGILANCE'
         WHEN 'Satisfaisant' THEN '🟢 4 · CONFORME'
         WHEN 'Surstock' THEN '🔵 5 · REDÉPLOYER'
         WHEN 'Stock dormant' THEN '⚪ 6 · À QUALIFIER'
         ELSE '⚫ 9 · À VÉRIFIER' END)
      label: Niveau d’urgence
      hasCustomLabel: true
      optionName: m_wt10eaeb
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE etat_stock
         WHEN 'Rupture' THEN 'Commande d’urgence ou emprunt au niveau supérieur. Vérifier d’abord que la fiche de stock a bien été transmise, puis redéployer depuis une structure en surstock du même produit.'
         WHEN 'Potentielle rupture' THEN 'Déclencher le réapprovisionnement maintenant : le stock ne couvre pas le délai de livraison. Dimensionner la quantité sur la CMM des 3 derniers mois.'
         WHEN 'Sous-stock' THEN 'Pas d’urgence. Inscrire le produit à la prochaine commande de routine et suivre l’évolution de la consommation.'
         WHEN 'Satisfaisant' THEN 'Aucune action. Maintenir le rythme de commande et la saisie régulière des mouvements.'
         WHEN 'Surstock' THEN 'Suspendre les commandes et organiser un redéploiement vers les structures en rupture du même produit. Croiser avec l’onglet Suivi de péremption avant tout transfert.'
         WHEN 'Stock dormant' THEN 'MSD non calculable (CMM = 0). Vérifier si le produit est réellement dispensé ici : corriger la saisie des consommations ou retirer le produit de la liste gérée.'
         ELSE 'État non classé : signaler la ligne à l’équipe données.' END)
      label: Propositions d'actions
      hasCustomLabel: true
      optionName: m_agv7iwoo
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
  percent_metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: Part des lignes
      hasCustomLabel: true
      optionName: m_omh0k7s9
