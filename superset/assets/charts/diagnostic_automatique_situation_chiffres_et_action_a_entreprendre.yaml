        MAX(CASE etat_stock
         WHEN 'Rupture' THEN 1
         WHEN 'Potentielle rupture' THEN 2
         WHEN 'Sous-stock' THEN 3
         WHEN 'Satisfaisant' THEN 4
         WHEN 'Surstock' THEN 5
         WHEN 'Stock dormant' THEN 6
         ELSE 7 END)
      label: Gravité
      hasCustomLabel: true
      optionName: m_grav_129
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: Lignes concernées
