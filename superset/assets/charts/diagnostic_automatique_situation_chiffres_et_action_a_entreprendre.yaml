  - expressionType: SQL
    sqlExpression: "MAX(CASE etat_stock\n WHEN 'Rupture' THEN 'Commande d\u2019urgence\
      \ ou emprunt au niveau sup\xE9rieur. V\xE9rifier d\u2019abord que la fiche de\
      \ stock a bien \xE9t\xE9 transmise, puis red\xE9ployer depuis une structure\
      \ en surstock du m\xEAme produit.'\n WHEN 'Potentielle rupture' THEN 'D\xE9\
      clencher le r\xE9approvisionnement maintenant : le stock ne couvre pas le d\xE9\
      lai de livraison. Dimensionner la quantit\xE9 sur la CMM des 3 derniers mois.'\n\
      \ WHEN 'Sous-stock' THEN 'Pas d\u2019urgence. Inscrire le produit \xE0 la prochaine\
      \ commande de routine et suivre l\u2019\xE9volution de la consommation.'\n WHEN\
      \ 'Satisfaisant' THEN 'Aucune action. Maintenir le rythme de commande et la\
      \ saisie r\xE9guli\xE8re des mouvements.'\n WHEN 'Surstock' THEN 'Suspendre\
      \ les commandes et organiser un red\xE9ploiement vers les structures en rupture\
      \ du m\xEAme produit. Croiser avec l\u2019onglet Suivi de p\xE9remption avant\
      \ tout transfert.'\n WHEN 'Stock dormant' THEN 'MSD non calculable (CMM = 0).\
      \ V\xE9rifier si le produit est r\xE9ellement dispens\xE9 ici : corriger la\
      \ saisie des consommations ou retirer le produit de la liste g\xE9r\xE9e.'\n\
      \ ELSE '\xC9tat non class\xE9 : signaler la ligne \xE0 l\u2019\xE9quipe donn\xE9\
      es.' END)"
    label: Propositions d'actions
    hasCustomLabel: true
    optionName: m_agv7iwoo
    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
