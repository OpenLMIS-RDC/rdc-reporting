    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE (CASE order_status WHEN 'TRANSFER_FAILED' THEN 1 WHEN 'ORDERED' THEN 2 WHEN 'FULFILLING' THEN 3 WHEN 'SHIPPED' THEN 4 WHEN 'RECEIVED' THEN 5 ELSE 9 END)
         WHEN 1 THEN '🔴 1 · CRITIQUE'
         WHEN 2 THEN '🟠 2 · URGENT'
         WHEN 3 THEN '🟡 3 · VIGILANCE'
         WHEN 4 THEN '🟠 4 · À CONFIRMER'
         WHEN 5 THEN '🟢 5 · CONFORME'
         ELSE '⚪ 9 · À QUALIFIER' END)
      label: Niveau d’urgence
      hasCustomLabel: true
      optionName: m_wnlq8uxk
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE (CASE order_status WHEN 'TRANSFER_FAILED' THEN 1 WHEN 'ORDERED' THEN 2 WHEN 'FULFILLING' THEN 3 WHEN 'SHIPPED' THEN 4 WHEN 'RECEIVED' THEN 5 ELSE 9 END)
         WHEN 1 THEN 'Incident technique : la commande a échoué et ne repartira pas seule. La relancer depuis l’application source ; si elle échoue de nouveau, ouvrir un ticket au support et prévenir la structure destinataire.'
         WHEN 2 THEN 'Goulot à l’entrée : l’entrepôt ne prend pas les demandes en charge. Vérifier sa charge et ses priorités, puis relancer les commandes les plus anciennes en premier.'
         WHEN 3 THEN 'Traitement en cours, normal tant qu’il ne vieillit pas. Mesurer l’ancienneté dans l’onglet Délai moyen de traitement des réquisitions avant toute intervention.'
         WHEN 4 THEN 'Le transport a eu lieu mais la réception n’est pas confirmée. Appeler les structures : dans la majorité des cas la marchandise est arrivée sans que la réception soit saisie. Corriger la saisie avant de conclure à une perte.'
         WHEN 5 THEN 'Aucune action. Maintenir la régularité de la confirmation de réception côté structures.'
         ELSE 'Statut non reconnu : vérifier la remontée du statut avant toute interprétation.' END)
      label: Propositions d'actions
      hasCustomLabel: true
      optionName: m_v8so70dt
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
