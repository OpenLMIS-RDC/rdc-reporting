  - expressionType: SQL
    sqlExpression: "MAX(CASE (CASE order_status WHEN 'TRANSFER_FAILED' THEN 1 WHEN\
      \ 'ORDERED' THEN 2 WHEN 'FULFILLING' THEN 3 WHEN 'SHIPPED' THEN 4 WHEN 'RECEIVED'\
      \ THEN 5 ELSE 9 END)\n WHEN 1 THEN 'Incident technique : la commande a \xE9\
      chou\xE9 et ne repartira pas seule. La relancer depuis l\u2019application source\
      \ ; si elle \xE9choue de nouveau, ouvrir un ticket au support et pr\xE9venir\
      \ la structure destinataire.'\n WHEN 2 THEN 'Goulot \xE0 l\u2019entr\xE9e :\
      \ l\u2019entrep\xF4t ne prend pas les demandes en charge. V\xE9rifier sa charge\
      \ et ses priorit\xE9s, puis relancer les commandes les plus anciennes en premier.'\n\
      \ WHEN 3 THEN 'Traitement en cours, normal tant qu\u2019il ne vieillit pas.\
      \ Mesurer l\u2019anciennet\xE9 dans l\u2019onglet D\xE9lai moyen de traitement\
      \ des r\xE9quisitions avant toute intervention.'\n WHEN 4 THEN 'Le transport\
      \ a eu lieu mais la r\xE9ception n\u2019est pas confirm\xE9e. Appeler les structures\
      \ : dans la majorit\xE9 des cas la marchandise est arriv\xE9e sans que la r\xE9\
      ception soit saisie. Corriger la saisie avant de conclure \xE0 une perte.'\n\
      \ WHEN 5 THEN 'Aucune action. Maintenir la r\xE9gularit\xE9 de la confirmation\
      \ de r\xE9ception c\xF4t\xE9 structures.'\n ELSE 'Statut non reconnu : v\xE9\
      rifier la remont\xE9e du statut avant toute interpr\xE9tation.' END)"
