    hasCustomLabel: true
    optionName: m_50pcalpi
    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
  - expressionType: SQL
    sqlExpression: "CASE\n WHEN AVG(est_en_rupture) >= 0.9 THEN '\U0001F534 CRITIQUE\
      \ \u2014 rupture quasi g\xE9n\xE9ralis\xE9e'\n WHEN AVG(est_en_rupture) >= 0.6\
      \ THEN '\U0001F7E0 \xC9LEV\xC9 \u2014 cha\xEEne fortement tendue'\n WHEN AVG(est_en_rupture)\
      \ >= 0.3 THEN '\U0001F7E1 MOD\xC9R\xC9 \u2014 tension localis\xE9e'\n WHEN AVG(est_en_surstock)\
      \ >= 0.2 THEN '\U0001F535 SURSTOCK \u2014 source de red\xE9ploiement'\n ELSE\
      \ '\U0001F7E2 SOUS CONTR\xD4LE' END"
    label: "Niveau d\u2019alerte"
    hasCustomLabel: true
    optionName: m_i0mp1qz2
    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
  - expressionType: SQL
    sqlExpression: "CASE\n WHEN AVG(est_en_rupture) >= 0.9 THEN 'Rupture quasi totale\
      \ \xE0 ce niveau : le blocage est en amont (commande, financement ou livraison\
      \ nationale). Escalader au niveau central \u2014 un red\xE9ploiement local ne\
      \ suffira pas.'\n WHEN AVG(est_en_rupture) >= 0.6 THEN 'Niveau tr\xE8s tendu.\
      \ V\xE9rifier si le niveau imm\xE9diatement sup\xE9rieur d\xE9tient du stock\
      \ : si oui le probl\xE8me est la distribution, organiser les livraisons ; sinon\
      \ passer commande d\u2019urgence.'\n WHEN AVG(est_en_rupture) >= 0.3 THEN 'Tension\
      \ localis\xE9e. Descendre dans le tableau crois\xE9 pour isoler les produits\
      \ et structures concern\xE9s, puis r\xE9approvisionner de fa\xE7on cibl\xE9\
      e.'\n WHEN AVG(est_en_surstock) >= 0.2 THEN 'Ce niveau d\xE9tient du surstock\
      \ alors que d\u2019autres sont en rupture : organiser un red\xE9ploiement descendant\
      \ avant p\xE9remption.'\n ELSE 'Situation ma\xEEtris\xE9e. Ce niveau peut servir\
      \ de source pour approvisionner les niveaux en tension.' END"
    label: Propositions d'actions
    hasCustomLabel: true
    optionName: m_l70jwraq
    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
