    - expressionType: SQL
      sqlExpression: |-
        CASE
         WHEN AVG(est_en_rupture) >= 0.9 THEN '🔴 CRITIQUE — rupture quasi généralisée'
         WHEN AVG(est_en_rupture) >= 0.6 THEN '🟠 ÉLEVÉ — chaîne fortement tendue'
         WHEN AVG(est_en_rupture) >= 0.3 THEN '🟡 MODÉRÉ — tension localisée'
         WHEN AVG(est_en_surstock) >= 0.2 THEN '🔵 SURSTOCK — source de redéploiement'
         ELSE '🟢 SOUS CONTRÔLE' END
      label: Niveau d’alerte
      hasCustomLabel: true
      optionName: m_i0mp1qz2
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        CASE
         WHEN AVG(est_en_rupture) >= 0.9 THEN 'Rupture quasi totale à ce niveau : le blocage est en amont (commande, financement ou livraison nationale). Escalader au niveau central — un redéploiement local ne suffira pas.'
         WHEN AVG(est_en_rupture) >= 0.6 THEN 'Niveau très tendu. Vérifier si le niveau immédiatement supérieur détient du stock : si oui le problème est la distribution, organiser les livraisons ; sinon passer commande d’urgence.'
         WHEN AVG(est_en_rupture) >= 0.3 THEN 'Tension localisée. Descendre dans le tableau croisé pour isoler les produits et structures concernés, puis réapprovisionner de façon ciblée.'
         WHEN AVG(est_en_surstock) >= 0.2 THEN 'Ce niveau détient du surstock alors que d’autres sont en rupture : organiser un redéploiement descendant avant péremption.'
         ELSE 'Situation maîtrisée. Ce niveau peut servir de source pour approvisionner les niveaux en tension.' END
      label: Propositions d'actions
      hasCustomLabel: true
      optionName: m_l70jwraq
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
