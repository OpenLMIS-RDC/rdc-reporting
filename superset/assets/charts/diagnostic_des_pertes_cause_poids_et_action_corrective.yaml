    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
  - expressionType: SQL
    sqlExpression: "MAX(CASE cause_principale\n WHEN '0. Aucune perte' THEN 'Aucune\
      \ perte d\xE9clar\xE9e. V\xE9rifier tout de m\xEAme que les pertes sont r\xE9\
      ellement saisies : une absence de perte peut n\u2019\xEAtre qu\u2019un d\xE9\
      faut de d\xE9claration.'\n WHEN '1. P\xE9remption' THEN 'Perte \xE9vitable.\
      \ Appliquer strictement le FEFO, red\xE9ployer les lots proches de la date limite\
      \ et r\xE9duire les quantit\xE9s command\xE9es. Croiser avec l\u2019onglet Suivi\
      \ de p\xE9remption pour agir avant la perte.'\n WHEN '2. Avarie / casse' THEN\
      \ 'Contr\xF4ler les conditions de stockage et de transport : cha\xEEne du froid,\
      \ palettisation, manutention, \xE9tanch\xE9it\xE9 et s\xE9curit\xE9 des locaux.'\n\
      \ WHEN '3. Vol / disparition' THEN 'D\xE9clencher un inventaire physique et\
      \ un contr\xF4le interne : acc\xE8s au magasin, tra\xE7abilit\xE9 des sorties,\
      \ s\xE9paration des t\xE2ches.'\n ELSE 'Cause non ventil\xE9e : demander \xE0\
      \ la structure de qualifier la perte, sinon aucune action corrective ne peut\
      \ \xEAtre cibl\xE9e.' END)"
