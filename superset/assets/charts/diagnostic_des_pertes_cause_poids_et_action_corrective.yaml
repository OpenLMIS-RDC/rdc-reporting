    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE cause_principale
         WHEN '0. Aucune perte' THEN '🟢 SAIN'
         WHEN '1. Péremption' THEN '🔴 ÉVITABLE'
         WHEN '2. Avarie / casse' THEN '🟠 CONDITIONS DE STOCKAGE'
         WHEN '3. Vol / disparition' THEN '🔴 CONTRÔLE INTERNE'
         ELSE '⚪ À DOCUMENTER' END)
      label: Niveau d’urgence
      hasCustomLabel: true
      optionName: m_dyc0ujjt
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE cause_principale
         WHEN '0. Aucune perte' THEN 'Aucune perte déclarée. Vérifier tout de même que les pertes sont réellement saisies : une absence de perte peut n’être qu’un défaut de déclaration.'
         WHEN '1. Péremption' THEN 'Perte évitable. Appliquer strictement le FEFO, redéployer les lots proches de la date limite et réduire les quantités commandées. Croiser avec l’onglet Suivi de péremption pour agir avant la perte.'
         WHEN '2. Avarie / casse' THEN 'Contrôler les conditions de stockage et de transport : chaîne du froid, palettisation, manutention, étanchéité et sécurité des locaux.'
         WHEN '3. Vol / disparition' THEN 'Déclencher un inventaire physique et un contrôle interne : accès au magasin, traçabilité des sorties, séparation des tâches.'
         ELSE 'Cause non ventilée : demander à la structure de qualifier la perte, sinon aucune action corrective ne peut être ciblée.' END)
      label: Propositions d'actions
      hasCustomLabel: true
      optionName: m_979zichg
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
