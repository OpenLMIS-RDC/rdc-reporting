      sqlExpression: SUM(quantites_en_fin_de_periode) / NULLIF(SUM(cmm), 0)
      isNew: false
      hasCustomLabel: true
      label: MSD
      optionName: metric_msd_stat_3
    - expressionType: SQL
      column: null
      aggregate: null
      sqlExpression: CASE WHEN SUM(cmm) IS NULL OR SUM(cmm) = 0 THEN '' WHEN SUM(quantites_en_fin_de_periode)
        / NULLIF(SUM(cmm), 0) <= 0 THEN '<span style="display:block;background-color:#C00000;color:#ffffff;padding:2px
        6px;font-weight:600;">Rupture</span>' WHEN SUM(quantites_en_fin_de_periode) / NULLIF(SUM(cmm),
        0) <= 4 THEN '<span style="display:block;background-color:#E8A33D;color:#ffffff;padding:2px 6px;font-weight:600;">Potentielle
        rupture</span>' WHEN SUM(quantites_en_fin_de_periode) / NULLIF(SUM(cmm), 0) <= 7 THEN '<span style="display:block;background-color:#F2E205;color:#333333;padding:2px
        6px;font-weight:600;">Sous-stock</span>' WHEN SUM(quantites_en_fin_de_periode) / NULLIF(SUM(cmm),
        0) <= 15 THEN '<span style="display:block;background-color:#3FA64B;color:#ffffff;padding:2px 6px;font-weight:600;">Satisfaisant</span>'
        ELSE '<span style="display:block;background-color:#4E93CF;color:#ffffff;padding:2px 6px;font-weight:600;">Surstock</span>'
        END
      isNew: false
      hasCustomLabel: true
      label: Statut
      optionName: metric_statut_stat_4
