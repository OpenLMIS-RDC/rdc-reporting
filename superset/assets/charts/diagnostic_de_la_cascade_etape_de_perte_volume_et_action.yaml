    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE (CASE WHEN COALESCE(qte_demandee,0)=0 THEN 6 WHEN COALESCE(qte_livree,0)=0 THEN 1 WHEN COALESCE(qte_approuvee,0) < 0.8*qte_demandee THEN 2 WHEN COALESCE(qte_livree,0) < 0.8*greatest(COALESCE(qte_approuvee,0),1) THEN 3 WHEN COALESCE(qte_rejetee,0) > 0.05*greatest(COALESCE(qte_livree,0),1) THEN 4 ELSE 5 END)
         WHEN 1 THEN 'Rien n’est sorti sur ces lignes. Vérifier d’abord que les expéditions sont bien saisies, puis remonter le blocage au niveau central. Croiser avec l’onglet Statut des commandes pour situer l’étape.'
         WHEN 2 THEN 'Le volume est perdu dès l’arbitrage, avant toute contrainte logistique. Revoir les règles d’approbation et le calibrage des quantités : une demande systématiquement rabotée entraîne une sur-demande en retour.'
         WHEN 3 THEN 'Rupture amont ou problème de transport. Vérifier la disponibilité dans le Rapport d’état de stock, puis le circuit logistique du programme concerné.'
         WHEN 4 THEN 'La qualité de ce qui arrive est en cause, pas la quantité. Investiguer les lots et les conditions de transport, et contrôler les dates de péremption à l’expédition.'
         WHEN 5 THEN 'Aucune action. Maintenir le rythme de commande et la régularité de la saisie mensuelle.'
         ELSE 'Angle mort de remontée, pas une absence de besoin. Confirmer auprès des structures que les réquisitions ont bien été transmises, puis corriger la saisie avant d’exploiter la tendance.' END)
      label: Propositions d'actions
      hasCustomLabel: true
      optionName: m_isxrdpfk
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
