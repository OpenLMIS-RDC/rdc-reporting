  groupby:
  - expressionType: SQL
    sqlExpression: "CASE (CASE WHEN COALESCE(qte_demandee,0)=0 THEN 6 WHEN COALESCE(qte_livree,0)=0\
      \ THEN 1 WHEN COALESCE(qte_approuvee,0) < 0.8*qte_demandee THEN 2 WHEN COALESCE(qte_livree,0)\
      \ < 0.8*greatest(COALESCE(qte_approuvee,0),1) THEN 3 WHEN COALESCE(qte_rejetee,0)\
      \ > 0.05*greatest(COALESCE(qte_livree,0),1) THEN 4 ELSE 5 END) WHEN 1 THEN '1.\
      \ Rien de livr\xE9' WHEN 2 THEN '2. Volume perdu \xE0 l\u2019approbation' WHEN\
      \ 3 THEN '3. Volume perdu \xE0 la livraison' WHEN 4 THEN '4. Rejet \xE0 la r\xE9\
      ception > 5 %' WHEN 5 THEN '5. Cascade conforme' ELSE '6. Demande nulle ou non\
      \ saisie' END"
    label: "\xC9tape de la cascade (du plus grave au moins grave)"
    hasCustomLabel: true
    optionName: col_xh7w845k
    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
