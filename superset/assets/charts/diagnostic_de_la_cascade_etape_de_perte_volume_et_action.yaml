  - expressionType: SQL
    sqlExpression: "MAX(CASE (CASE WHEN COALESCE(qte_demandee,0)=0 THEN 6 WHEN COALESCE(qte_livree,0)=0\
      \ THEN 1 WHEN COALESCE(qte_approuvee,0) < 0.8*qte_demandee THEN 2 WHEN COALESCE(qte_livree,0)\
      \ < 0.8*greatest(COALESCE(qte_approuvee,0),1) THEN 3 WHEN COALESCE(qte_rejetee,0)\
      \ > 0.05*greatest(COALESCE(qte_livree,0),1) THEN 4 ELSE 5 END)\n WHEN 1 THEN\
      \ '\U0001F534 1 \xB7 CRITIQUE'\n WHEN 2 THEN '\U0001F7E0 2 \xB7 URGENT'\n WHEN\
      \ 3 THEN '\U0001F7E0 3 \xB7 URGENT'\n WHEN 4 THEN '\U0001F7E1 4 \xB7 VIGILANCE'\n\
      \ WHEN 5 THEN '\U0001F7E2 5 \xB7 CONFORME'\n ELSE '\u26AA 6 \xB7 \xC0 QUALIFIER'\
      \ END)"
    label: "Niveau d\u2019urgence"
    hasCustomLabel: true
    optionName: m_tnj1lfr8
    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
  - expressionType: SQL
    sqlExpression: "MAX(CASE (CASE WHEN COALESCE(qte_demandee,0)=0 THEN 6 WHEN COALESCE(qte_livree,0)=0\
      \ THEN 1 WHEN COALESCE(qte_approuvee,0) < 0.8*qte_demandee THEN 2 WHEN COALESCE(qte_livree,0)\
      \ < 0.8*greatest(COALESCE(qte_approuvee,0),1) THEN 3 WHEN COALESCE(qte_rejetee,0)\
      \ > 0.05*greatest(COALESCE(qte_livree,0),1) THEN 4 ELSE 5 END)\n WHEN 1 THEN\
      \ 'Rien n\u2019est sorti sur ces lignes. V\xE9rifier d\u2019abord que les exp\xE9\
      ditions sont bien saisies, puis remonter le blocage au niveau central. Croiser\
      \ avec l\u2019onglet Statut des commandes pour situer l\u2019\xE9tape.'\n WHEN\
      \ 2 THEN 'Le volume est perdu d\xE8s l\u2019arbitrage, avant toute contrainte\
      \ logistique. Revoir les r\xE8gles d\u2019approbation et le calibrage des quantit\xE9\
      s : une demande syst\xE9matiquement rabot\xE9e entra\xEEne une sur-demande en\
      \ retour.'\n WHEN 3 THEN 'Rupture amont ou probl\xE8me de transport. V\xE9rifier\
      \ la disponibilit\xE9 dans le Rapport d\u2019\xE9tat de stock, puis le circuit\
      \ logistique du programme concern\xE9.'\n WHEN 4 THEN 'La qualit\xE9 de ce qui\
      \ arrive est en cause, pas la quantit\xE9. Investiguer les lots et les conditions\
      \ de transport, et contr\xF4ler les dates de p\xE9remption \xE0 l\u2019exp\xE9\
      dition.'\n WHEN 5 THEN 'Aucune action. Maintenir le rythme de commande et la\
      \ r\xE9gularit\xE9 de la saisie mensuelle.'\n ELSE 'Angle mort de remont\xE9\
      e, pas une absence de besoin. Confirmer aupr\xE8s des structures que les r\xE9\
      quisitions ont bien \xE9t\xE9 transmises, puis corriger la saisie avant d\u2019\
      exploiter la tendance.' END)"
