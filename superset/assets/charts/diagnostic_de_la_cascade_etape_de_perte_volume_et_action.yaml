      \ < 0.8*greatest(COALESCE(qte_approuvee,0),1) THEN 3 WHEN COALESCE(qte_rejetee,0)\
      \ > 0.05*greatest(COALESCE(qte_livree,0),1) THEN 4 ELSE 5 END)\n WHEN 1 THEN\
      \ 1\n WHEN 2 THEN 2\n WHEN 3 THEN 2\n WHEN 4 THEN 3\n WHEN 5 THEN 4\n ELSE 6\
      \ END)"
