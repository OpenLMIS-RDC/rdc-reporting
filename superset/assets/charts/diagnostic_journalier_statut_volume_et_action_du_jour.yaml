        MAX(CASE statut
         WHEN '1. Rupture' THEN 1
         WHEN '2. Risque de rupture' THEN 2
         WHEN '3. Satisfaisant' THEN 4
         WHEN '4. Stock présent - CMM indisponible' THEN 3
         WHEN '5. Sans donnée' THEN 6
         WHEN '6. Surstock' THEN 5
         ELSE 7 END)
