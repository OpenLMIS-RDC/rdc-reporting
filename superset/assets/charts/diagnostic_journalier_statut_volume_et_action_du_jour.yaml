      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE statut
         WHEN '1. Rupture' THEN '🔴 CRITIQUE'
         WHEN '2. Risque de rupture' THEN '🟠 URGENT'
         WHEN '3. Satisfaisant' THEN '🟢 CONFORME'
         WHEN '4. Stock présent - CMM indisponible' THEN '🟡 DONNÉE INCOMPLÈTE'
         WHEN '5. Sans donnée' THEN '⚪ NON RAPPORTÉ'
         WHEN '6. Surstock' THEN '🔵 REDÉPLOYER'
         ELSE '⚫ À VÉRIFIER' END)
      label: Niveau d’urgence
      hasCustomLabel: true
      optionName: m_lvy74h0e
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
    - expressionType: SQL
      sqlExpression: |-
        MAX(CASE statut
         WHEN '1. Rupture' THEN 'Stock nul. Constituer la liste d’action du jour à partir du graphique « Produits en rupture au dernier jour ».'
         WHEN '2. Risque de rupture' THEN 'Moins d’un mois de couverture : lancer le réapprovisionnement immédiatement, sans attendre le cycle de commande.'
         WHEN '3. Satisfaisant' THEN 'Couverture de 1 à 3 mois. Aucune action, maintenir la saisie quotidienne des mouvements.'
         WHEN '4. Stock présent - CMM indisponible' THEN 'Il y a du stock mais aucune consommation exploitable : impossible de juger la couverture. Faire remonter les consommations pour que la CMM se calcule.'
         WHEN '5. Sans donnée' THEN 'Aucune donnée de stock ce jour-là. Relancer la structure : la complétude de la saisie conditionne la fiabilité du taux de rupture.'
         WHEN '6. Surstock' THEN 'Plus de 3 mois de couverture : suspendre les commandes et proposer un transfert vers les structures en rupture du même produit.'
         ELSE 'Statut non reconnu : signaler à l’équipe données.' END)
      label: Propositions d'actions
      hasCustomLabel: true
      optionName: m_ubhh139b
      sqlExpressionType: SIMPLE
      aggregate: null
      column: null
  percent_metrics:
    - expressionType: SQL
