      \ THEN '\U0001F7E2 CONFORME'\n WHEN '4. Stock pr\xE9sent - CMM indisponible'\
      \ THEN '\U0001F7E1 DONN\xC9E INCOMPL\xC8TE'\n WHEN '5. Sans donn\xE9e' THEN\
      \ '\u26AA NON RAPPORT\xC9'\n WHEN '6. Surstock' THEN '\U0001F535 RED\xC9PLOYER'\n\
      \ ELSE '\u26AB \xC0 V\xC9RIFIER' END)"
    label: "Niveau d\u2019urgence"
    hasCustomLabel: true
    optionName: m_lvy74h0e
    sqlExpressionType: SIMPLE
    aggregate: null
    column: null
  - expressionType: SQL
    sqlExpression: "MAX(CASE statut\n WHEN '1. Rupture' THEN 'Stock nul. Constituer\
      \ la liste d\u2019action du jour \xE0 partir du graphique \xAB Produits en rupture\
      \ au dernier jour \xBB.'\n WHEN '2. Risque de rupture' THEN 'Moins d\u2019un\
      \ mois de couverture : lancer le r\xE9approvisionnement imm\xE9diatement, sans\
      \ attendre le cycle de commande.'\n WHEN '3. Satisfaisant' THEN 'Couverture\
      \ de 1 \xE0 3 mois. Aucune action, maintenir la saisie quotidienne des mouvements.'\n\
      \ WHEN '4. Stock pr\xE9sent - CMM indisponible' THEN 'Il y a du stock mais aucune\
      \ consommation exploitable : impossible de juger la couverture. Faire remonter\
      \ les consommations pour que la CMM se calcule.'\n WHEN '5. Sans donn\xE9e'\
      \ THEN 'Aucune donn\xE9e de stock ce jour-l\xE0. Relancer la structure : la\
      \ compl\xE9tude de la saisie conditionne la fiabilit\xE9 du taux de rupture.'\n\
      \ WHEN '6. Surstock' THEN 'Plus de 3 mois de couverture : suspendre les commandes\
      \ et proposer un transfert vers les structures en rupture du m\xEAme produit.'\n\
      \ ELSE 'Statut non reconnu : signaler \xE0 l\u2019\xE9quipe donn\xE9es.' END)"
    label: Propositions d'actions
    hasCustomLabel: true
