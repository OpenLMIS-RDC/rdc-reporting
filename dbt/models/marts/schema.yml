version: 2

# DRC marts (mart_drc_*). Prefer ref() to a core mart over rebuilding from
# staging; see docs/reporting-stack-migration.md Part B/C for the target of
# each legacy view.
models:
  - name: mart_drc_facility_directory
    description: >
      DRC facility dimension, replacing legacy analytics.dim_facility. One
      row per facility with the district / region / country rungs, facility
      type, operator, and the province (PROV), health zone (ZS) and health
      area (AS) names from a walk up stg_geographic_zones joined to
      drc_stg_geographic_levels on the level code.
    columns:
      - name: facility_id
        description: Facility UUID
        tests:
          - not_null
          - unique
      - name: facility_code
        tests:
          - not_null
      - name: facility_name
        tests:
          - not_null
      - name: district_id
        description: Zone the facility is attached to (legacy name; not always a district)
      - name: region_id
        description: Parent of the facility's zone
      - name: country_id
        description: Grandparent of the facility's zone
      - name: geographic_zone_name
        description: Same as district_name, kept for the legacy datasets
      - name: geographic_level
        description: Level name of the facility's zone
      - name: province_name
        description: Name of the PROV-level zone on the facility's path, NULL if none
      - name: health_zone_name
        description: Name of the ZS-level zone on the facility's path, NULL if none
      - name: health_area_name
        description: Name of the AS-level zone on the facility's path, NULL if none

  - name: mart_drc_requisition_leadtime
    description: >
      DRC requisition lead time, replacing legacy
      analytics.fact_requisition_leadtime and the "Suivi des réquisitions"
      dataset. One row per requisition with the first date it reached each
      status, the delays in days between milestones, and the French labels,
      counters and dimensions of the dataset. The "Suivi des réquisitions –
      étapes" dataset is an unpivot of this grain.
    columns:
      - name: req_id
        description: Requisition UUID
        tests:
          - not_null
          - unique
      - name: req_status_current
        tests:
          - not_null
      - name: date_initiated
        description: First INITIATED status change
      - name: date_last_change
        description: Latest status change of any status
      - name: delai_total_initiated_to_released_j
        description: Days from INITIATED to RELEASED, NULL if not released
      - name: month_initiated
        description: First day of the month of date_initiated
      - name: numero_requisition
        description: REQ-<program code>-<period YYYYMM>-<first 8 chars of the id>
      - name: statut_code
        description: Same as req_status_current, dataset name
      - name: nb_initiee
        description: Always 1; counters nb_* are 1 when the milestone was reached
      - name: tranche_celerite
        description: Bucket of delai_total_j, '5. Non libérée' when not released

  - name: mart_drc_order_flow
    description: >
      DRC order flow per product, replacing legacy public.vw_order_flow_product
      and the ds_commandes dataset. One row per order line item with the
      requested and approved quantities of the source requisition, the
      ordered quantity, the accepted / rejected quantities from the proofs of
      delivery, and the satisfaction, reception and rejection rates.
    columns:
      - name: order_line_item_id
        description: Order line item UUID (row id, added; not in the legacy view)
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
      - name: requisition_id
        description: Order external id, the requisition the order was released from
      - name: orderable_id
        tests:
          - not_null
      - name: statut_commande
        description: French order status as relabelled by ds_commandes
      - name: qte_livree
        description: qte_acceptee + qte_rejetee, 0 when no proof of delivery
      - name: taux_satisfaction_pct
        description: 100 * qte_livree / qte_commandee, capped at 100, NULL when nothing ordered
      - name: taux_reception_pct
        description: 100 * qte_acceptee / qte_commandee, capped at 100, NULL when nothing ordered
      - name: taux_rejet_pct
        description: 100 * qte_rejetee / qte_livree, NULL when nothing delivered
      - name: incoherence_qte
        description: 1 when more was accepted than ordered
      - name: facility_id
        description: Ordering facility (replaces the ds_commandes lookup by facility name)

  - name: mart_drc_stock_adjustments
    description: >
      DRC stock adjustments, replacing legacy public.vw_stock_adjustments and
      the ds_ajustement dataset. One row per stock card line item with a
      reason in the ADJUSTMENT category, excluding consumption, receipts and
      the beginning-balance corrections, with the signed quantity and the
      user who entered it.
    columns:
      - name: line_item_id
        description: Stock card line item UUID
        tests:
          - not_null
          - unique
      - name: quantite_ajustee
        description: Quantity, positive for CREDIT reasons and negative otherwise
        tests:
          - not_null
      - name: quantite_absolue
        description: Unsigned quantity
        tests:
          - not_null
      - name: reasontype
        tests:
          - not_null
      - name: date_ajustement
        tests:
          - not_null
      - name: utilisateur_ayant_ajuste
        description: First and last name of the user who entered the line, '' if unknown
      - name: login_utilisateur
        description: Username of that user, NULL if the user is not found
      - name: facility_id
        description: Stock card facility (replaces the ds_ajustement lookup by facility name)

  - name: mart_drc_expiry_risk
    description: >
      DRC expiry risk, replacing legacy analytics.fact_expired_risk_snapshot,
      public.vw_expiry_risk and the ds_expiration dataset. One row per
      facility x program x product x lot whose lot is expired or expires
      within 90 days of the build date, with the 30 / 60 / 90-day quantity
      buckets and the USD value of the 30-day bucket.
    tests:
      - unique:
          column_name: "(facility_id, program_id, product_id, lot_id)"
    columns:
      - name: lot_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: date_expiration
        tests:
          - not_null
      - name: program_id
        description: Program of the stock cards (added; the legacy view grouped by it without exposing it)
      - name: stock_on_hand
        description: >
          Sum of line item quantities on the lot's cards, as in the legacy
          repo SQL (unsigned; see the model header)
      - name: jours_avant_expiration
        description: Days from the build date to the expiration date, negative when expired
      - name: valeur_usd_30j
        description: qte_expirant_30j * price per pack / net content, rounded to 2 decimals

  - name: mart_drc_stock_monthly
    description: >
      DRC monthly stock, replacing legacy analytics.fact_stock_monthly and the
      RUPTURE PAR PRODUIT dataset. One row per month x facility x program x
      product with flows, opening / average / closing balance, stockout and
      observed days, adjusted consumption, 3-month AMC and months of stock,
      and the stockout severity labels.
    tests:
      - unique:
          column_name: "(month_date, facility_id, program_id, product_id)"
    columns:
      - name: month_date
        tests:
          - not_null
      - name: facility_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: active_days
        description: Days of the month present in the daily series
        tests:
          - not_null
      - name: adjusted_consumption
        description: consumptions scaled up to the month's days with stock, 0 when no such day
      - name: amc_3m
        description: Average adjusted_consumption of the 3 preceding months, NULL in the key's first month
      - name: msd_3m
        description: closing_balance / amc_3m; NULL when stock without consumption, 0 when out of stock
      - name: severite_rupture
        description: Share of the observed days spent out of stock, as a label

  - name: mart_drc_stock_daily
    description: >
      DRC daily stock, replacing legacy analytics.stock_daily_history /
      fact_stock_daily and the two daily report datasets. One row per day x
      facility x program x product with balances, flows, the previous month's
      CMM, months of stock, stock status and the report flags.
    tests:
      - unique:
          column_name: "(movement_date, facility_id, program_id, product_id)"
    columns:
      - name: movement_date
        tests:
          - not_null
      - name: facility_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: cmm_m_1
        description: amc_3m of the previous month, else of the current month, else 0
      - name: msd
        description: stock_on_hand / cmm_m_1, NULL when cmm_m_1 is 0
      - name: est_dernier_jour
        description: 1 on the latest day of the series (yesterday)
      - name: jours_en_rupture
        description: Stockout days of the key over the whole series

  - name: mart_drc_stock_msd
    description: >
      DRC stock status by months of stock, replacing legacy public.vw_stock_msd
      and the two ETAT DE STOCK datasets. One row per facility x program x
      product with the latest balance, the 3-month CMM, the MSD and the stock
      state band.
    tests:
      - unique:
          column_name: "(facility_id, program_id, product_id)"
    columns:
      - name: facility_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: etat_stock
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Rupture', 'Stock dormant', 'Potentielle rupture', 'Sous-stock', 'Satisfaisant', 'Surstock']
      - name: cmm
        description: Consumption of the last 3 months of movements / 3, NULL without consumption
      - name: msd
        description: 0 when out of stock, NULL when CMM is 0, capped at 24

  - name: mart_drc_stockout_facilities
    description: >
      DRC stockouts by facility, replacing legacy public.vw_rupture_structures
      and the Ruptures_stock dataset. One row per active program product x
      facility supporting the program, with the latest stock on hand and
      stockout / no-data flags.
    tests:
      - unique:
          column_name: "(facility_id, program_id, product_id)"
    columns:
      - name: facility_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: program_id
        tests:
          - not_null
      - name: stock_on_hand
        description: Latest balance of the product at the facility, summed over programs; NULL without stock card
      - name: sans_donnee
        description: 1 when the facility has no stock card for the product

  - name: mart_drc_loss_rate
    description: >
      DRC loss rate, replacing legacy public.vw_taux_perte and the Taux de
      perte dataset. One row per month x facility x program x product with
      movements, with receipts, issues, losses by cause, the month's opening
      balance and four loss-rate denominators.
    tests:
      - unique:
          column_name: "(date_rapport, facility_id, program_id, product_id)"
    columns:
      - name: date_rapport
        description: First day of the month
        tests:
          - not_null
      - name: facility_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: stock_debut
        description: Opening balance of the month's first day in the daily series, NULL before the series starts
      - name: taux_perte_pct
        description: 100 * quantite_perdue / quantite_sorties, rounded to 1 decimal
